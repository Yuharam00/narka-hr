/* HARAM Design System rev.01 — Office Management 적용
   Layout: 앱형 3단 — 좌측 조회 사이드바 · 중앙 도면 뷰포트 · 우측 상세 패널, 상단 현황 스트립 */
:root{
  /* Color — rev.01 보드 기준 (Background #FAFAF8 · Surface #FFFFFF · Text #202020/#737373 · Border #E8E8E5) */
  --bg:#FAFAF8; --surface:#FFFFFF; --subtle:#F4F4F2; --stage:#F2F2EF;
  --ink:#202020; --ink-2:#737373; --muted:#9A9A97; --line:#E8E8E5; --line-2:#D9D9D5;
  --accent:#3D47C9; --accent-soft:#EEEFFC; --accent-hover:#3239B0;
  --success:#10B981; --warning:#F59E0B; --danger:#EF4444; --info:#3B82F6;
  /* 3D 도면 재질 */
  --floor:#FAFAF8; --room:#F0F0EC; --wall:#DCDBD6; --furn:#C9C8C2; --grid:#E7E6E1;
  --vacant:#E2E1DC; --chair:#6E6E74; --monitor:#2A2A2E; --wall-top:#77766F;
  /* Type */
  --font-kr:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --font-en:'Inter','Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  /* Display 56/700 · H1 40/700 · H2 28/600 · H3 20/600 · Body 16/400 · Caption 14/400 (앱 화면은 H2 이하 사용) */
  --fs-xs:12px; --fs-sm:13px; --fs-base:14px; --fs-md:16px; --fs-lg:20px; --fs-xl:24px; --fs-2xl:28px;
  --fw-regular:400; --fw-medium:500; --fw-semibold:600; --fw-bold:700;
  --lh-tight:1.3; --lh-base:1.6; --ls-tight:-0.02em; --ls-base:-0.01em; --ls-label:0.04em;
  /* Spacing 4·8·12·16·24·32·48·64·80 */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-10:48px;
  /* Radius · Border · Shadow */
  --r-sm:4px; --r-md:8px; --r-lg:12px; --r-xl:16px; --r-pill:999px;
  --bd:1px solid var(--line); --bd-strong:1px solid var(--line-2);
  --sh-card:0 1px 2px rgba(32,32,32,.04); --sh-pop:0 12px 32px rgba(32,32,32,.10),0 2px 6px rgba(32,32,32,.05);
  /* Motion */
  --ease:cubic-bezier(.2,0,0,1); --dur-fast:120ms; --dur-base:180ms;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121214; --surface:#18181B; --subtle:#1F1F23; --stage:#151517;
  --ink:#EDEDED; --ink-2:#A3A3A3; --muted:#86868C; --line:#2A2A2F; --line-2:#36363C;
  --accent:#8E95F0; --accent-soft:#23254A; --accent-hover:#A6ACF5;
  --success:#34D399; --warning:#FBBF24; --danger:#F87171; --info:#60A5FA;
  --floor:#1C1C1F; --room:#222226; --wall:#3A3A40; --furn:#4A4A50; --grid:#26262A;
  --vacant:#34343A; --chair:#77777E; --monitor:#0D0D0F; --wall-top:#8A8A90; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121214; --surface:#18181B; --subtle:#1F1F23; --stage:#151517;
  --ink:#EDEDED; --ink-2:#A3A3A3; --muted:#86868C; --line:#2A2A2F; --line-2:#36363C;
  --accent:#8E95F0; --accent-soft:#23254A; --accent-hover:#A6ACF5;
  --success:#34D399; --warning:#FBBF24; --danger:#F87171; --info:#60A5FA;
  --floor:#1C1C1F; --room:#222226; --wall:#3A3A40; --furn:#4A4A50; --grid:#26262A;
  --vacant:#34343A; --chair:#77777E; --monitor:#0D0D0F; --wall-top:#8A8A90; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-kr);font-size:var(--fs-base);line-height:var(--lh-base);
  letter-spacing:var(--ls-base);font-weight:var(--fw-regular);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num,.en{font-family:var(--font-en);font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
.app{max-width:1440px;margin:0 auto;padding-block:var(--sp-8) var(--sp-10);display:flex;flex-direction:column;gap:var(--sp-6)}

/* Header */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:var(--sp-4);padding-bottom:var(--sp-6);border-bottom:var(--bd)}
.meta{display:flex;gap:var(--sp-2);align-items:center;margin:0 0 var(--sp-2);font-size:var(--fs-sm);color:var(--muted)}
.meta i{width:3px;height:3px;border-radius:50%;background:var(--line-2)}
.addr{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-2);margin:var(--sp-2) 0 0;font-size:var(--fs-base);color:var(--ink-2)}
.addr-k{font-size:var(--fs-xs);font-weight:var(--fw-medium);color:var(--muted);padding:1px 8px;border:var(--bd);border-radius:var(--r-pill);background:var(--surface)}
h1{margin:0;font-size:var(--fs-2xl);font-weight:var(--fw-semibold);letter-spacing:var(--ls-tight);line-height:var(--lh-tight);text-wrap:balance}
.actions{display:flex;gap:var(--sp-2);flex-wrap:wrap}

/* Button · Segmented */
button{font:inherit;color:inherit;letter-spacing:inherit}
.btn{height:36px;padding:0 var(--sp-4);border:1px solid transparent;border-radius:var(--r-md);background:var(--accent-soft);color:var(--accent);
  font-size:var(--fs-base);font-weight:var(--fw-medium);cursor:pointer;transition:background var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease)}
.btn:hover{background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.seg{display:inline-flex;padding:3px;gap:2px;background:var(--subtle);border:var(--bd);border-radius:var(--r-md)}
.seg button{border-radius:6px!important}
.seg button{height:28px;padding:0 var(--sp-4);border:0;border-radius:var(--r-sm);background:transparent;color:var(--ink-2);font-size:var(--fs-base);font-weight:var(--fw-medium);cursor:pointer;
  transition:background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);font-weight:var(--fw-semibold);box-shadow:0 1px 2px rgba(20,20,22,.08),0 0 0 1px var(--line)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Status strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:var(--bd);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-card);margin:0}
.strip>div{padding:var(--sp-4) var(--sp-5);display:flex;flex-direction:column;gap:2px;min-width:0}
.strip>div+div{border-left:var(--bd)}
.strip dt{font-size:var(--fs-sm);color:var(--muted);display:flex;align-items:center;gap:6px}
.strip dd{margin:0;font-family:var(--font-en);font-size:var(--fs-2xl);font-weight:var(--fw-semibold);line-height:1.2;font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
.strip dd small{font-size:var(--fs-sm);color:var(--muted);font-weight:var(--fw-regular);margin-left:4px;font-family:var(--font-kr)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c,var(--muted));flex:none}
@media (max-width:640px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.strip>div:nth-child(3){border-left:0}.strip>div:nth-child(n+3){border-top:var(--bd)}}

/* Workspace */
.work{display:grid;grid-template-columns:248px minmax(0,1fr) 300px;gap:var(--sp-6);align-items:start}
@media (max-width:1180px){.work{grid-template-columns:minmax(0,1fr) 300px}.side-l{grid-column:1/-1;grid-row:2}}
@media (max-width:860px){.work{grid-template-columns:minmax(0,1fr)}.side-l{grid-row:auto;order:2}.view{order:1;height:400px}.work>aside:last-child{order:3}}
.panel{display:flex;flex-direction:column;gap:var(--sp-6);min-width:0}
.sec{display:flex;flex-direction:column;gap:var(--sp-3)}
.label{font-size:var(--fs-xs);font-weight:var(--fw-medium);letter-spacing:var(--ls-label);color:var(--muted);margin:0}
@media (max-width:1180px) and (min-width:861px){.side-l{flex-direction:row}.side-l .sec{flex:1}}

/* Select */
.select{position:relative}
.select select{appearance:none;width:100%;height:42px;padding:0 36px 0 var(--sp-3);border:var(--bd-strong);border-radius:var(--r-md);background:var(--surface);
  color:var(--ink);font:inherit;font-size:var(--fs-base);cursor:pointer;transition:border-color var(--dur-fast) var(--ease)}
.select select:hover{border-color:var(--muted)}
.select select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.select::after{content:"";position:absolute;right:14px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}

/* Filter list (sidebar) */
.filters{display:flex;flex-direction:column;gap:2px}
.filters button{display:flex;align-items:center;gap:var(--sp-3);width:100%;height:36px;padding:0 var(--sp-2);border:0;border-radius:var(--r-md);background:transparent;
  font-size:var(--fs-base);color:var(--ink-2);text-align:left;cursor:pointer;transition:background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.filters button::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c);flex:none}
.filters button em{margin-left:auto;font-style:normal;font-family:var(--font-en);font-size:var(--fs-sm);color:var(--muted);font-variant-numeric:tabular-nums}
.filters button:hover{background:var(--subtle);color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:var(--fw-semibold)}
.filters button[aria-pressed="true"] em{color:var(--accent)}
.hint-s{font-size:var(--fs-sm);color:var(--muted);margin:0}

/* Viewport */
.view{position:relative;height:clamp(380px,70vh,760px);border:var(--bd);border-radius:var(--r-lg);box-shadow:var(--sh-card);overflow:hidden;background:var(--stage)}
.view canvas{display:block;width:100%;height:100%}
.phase{position:absolute;top:var(--sp-3);left:var(--sp-3);display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;border:var(--bd);border-radius:var(--r-pill);
  background:var(--surface);font-size:var(--fs-sm);color:var(--ink-2)}
.phase i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.hint{position:absolute;left:var(--sp-3);right:var(--sp-3);bottom:var(--sp-3);margin:0;font-size:var(--fs-sm);color:var(--muted);pointer-events:none}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,calc(-100% - 10px));padding:6px 10px;border-radius:var(--r-sm);background:var(--ink);color:var(--surface);
  font-size:var(--fs-sm);font-weight:var(--fw-medium);white-space:nowrap;pointer-events:none;box-shadow:var(--sh-pop)}
.tag::after{content:"";position:absolute;left:50%;bottom:-4px;width:8px;height:8px;background:var(--ink);transform:translateX(-50%) rotate(45deg)}
.tag b{font-family:var(--font-en);font-weight:var(--fw-medium);opacity:.6;margin-right:6px}
.fail{position:absolute;inset:0;display:grid;place-items:center;margin:0;padding:var(--sp-6);text-align:center;color:var(--muted)}

/* Detail panel */
.detail{border:var(--bd);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-card);padding:var(--sp-5);display:flex;flex-direction:column;gap:var(--sp-4);min-height:220px;
  animation:fade var(--dur-base) var(--ease)}
@keyframes fade{from{opacity:.4;transform:translateY(2px)}to{opacity:1;transform:none}}
.info-head{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-2)}
.info-name{margin:0;font-size:var(--fs-xl);font-weight:var(--fw-semibold);letter-spacing:var(--ls-tight);line-height:var(--lh-tight);display:flex;align-items:baseline;gap:var(--sp-2);flex-wrap:wrap}
.alias{font-size:var(--fs-xs);font-weight:var(--fw-medium);color:var(--muted);border:var(--bd);border-radius:var(--r-sm);padding:1px 6px;letter-spacing:0}
.role{margin:-8px 0 0;color:var(--ink-2);font-size:var(--fs-base)}
.badge{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--c) 12%,var(--surface));
  border:1px solid color-mix(in srgb,var(--c) 22%,var(--surface));font-size:var(--fs-xs);font-weight:var(--fw-medium);color:color-mix(in srgb,var(--c) 78%,var(--ink));white-space:nowrap}
dl.kv{display:grid;grid-template-columns:72px minmax(0,1fr);margin:0;font-size:var(--fs-base);border-top:var(--bd)}
dl.kv dt,dl.kv dd{padding:var(--sp-2) 0;border-bottom:var(--bd)}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;color:var(--ink)}
.empty{display:flex;flex-direction:column;gap:var(--sp-2)}
.empty p{margin:0}
.empty .t{font-size:var(--fs-md);font-weight:var(--fw-medium)}
.empty .d{color:var(--ink-2)}
.keys{display:flex;flex-direction:column;gap:6px;margin-top:var(--sp-2);padding-top:var(--sp-3);border-top:var(--bd);font-size:var(--fs-sm);color:var(--ink-2)}
.keys span{display:flex;align-items:center;gap:var(--sp-2)}
.keys i{width:14px;height:8px;border-radius:2px;background:var(--c)}

/* Drawing info table */
table.spec{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
table.spec th,table.spec td{text-align:left;vertical-align:top;padding:9px 0;border-bottom:var(--bd);font-weight:var(--fw-regular)}
table.spec th{width:76px;color:var(--muted);padding-right:var(--sp-3)}
table.spec td{color:var(--ink)}
table.spec tr:first-child th,table.spec tr:first-child td{border-top:var(--bd)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function(){
'use strict';
const view = document.getElementById('view');
const tagEl = document.getElementById('tag');
const phaseText = document.getElementById('phase-text');
const infoEl = document.getElementById('info');
const btnPlan = document.getElementById('btn-plan');
const btn3d = document.getElementById('btn-3d');
const btnReplay = document.getElementById('btn-replay');
const finder = document.getElementById('seat-find');
const legendEl = document.getElementById('legend');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- data (자리배치표 rev.01 · 대표이사 초안 반영) · 단위 m, 도면 좌상단 기준 ---------- */
const TEAMS = {
  mkt:{label:'마케팅',color:'#C9785F'}, cre:{label:'크리에이티브',color:'#BE9B4E'},
  bm:{label:'BM',color:'#8C7DB3'}, md:{label:'MD',color:'#4F988A'},
  glb:{label:'글로벌(일본)',color:'#6189B8'}, sales:{label:'해외영업',color:'#7A9B5E'},
  ops:{label:'경영팀',color:'#A08870'}, sourcing:{label:'전략구매',color:'#4D7C9C'}, hr:{label:'인사',color:'#BF7790'},
  exec:{label:'경영진',color:'#7D8590'}
};
const VACANT_CHIP = '#B3B2AC';
const W_TOT = 27.36, D_TOT = 14.8, WING_X = 13.0, WING_Z = 5.7;
const ROOMS = [
  {key:'big',name:'대회의실',x:0,z:0,w:4.7,d:5.7,rows:[['크기','4,760 × 5,530 mm'],['수용','12인'],['구성','장방형 회의 테이블 · 모니터']]},
  {key:'pantry',name:'탕비실',x:4.7,z:0,w:3.96,d:3.85,rows:[['크기','3,900 × 3,680 mm'],['구성','싱크 카운터 · 6인 테이블']]},
  {key:'ma',name:'회의실 A',x:8.66,z:0,w:4.5,d:3.85,rows:[['크기','4,500 × 3,680 mm'],['수용','6인'],['구성','회의 테이블 · 모니터']]},
  {key:'mb',name:'회의실 B',x:13.16,z:0,w:4.74,d:3.85,rows:[['크기','4,500 × 3,680 mm'],['수용','6인'],['구성','회의 테이블 · 모니터']]},
  {key:'entry',name:'입구',x:13.0,z:5.7,w:2.1,d:5.3,rows:[['폭','2,050 mm'],['구성','출입문 · 수납벽1과 접한 진입 복도']]},
  {key:'rest',name:'휴게실',x:13.0,z:11.0,w:2.1,d:3.0,rows:[['크기','2,050 × 2,600 mm'],['구성','안마의자'],['출입','남측 창가 통로에서 진입']]},
  {key:'ceo',name:'대표실',x:24.1,z:9.0,w:3.26,d:5.8,rows:[['크기','약 3,200 × 5,100 mm'],['사용','최다예 대표이사'],['구성','집무 책상 · 6인 회의 테이블']]}
];

/* 섬 정의: 실제 도면의 책상 묶음 위치 */
const ASSIGN = {
  A:[["md","occ","고문희"], ["md","occ","유경아"], ["glb","occ","심연옥"], [null, "vacant"], ["md","occ","박은애"], ["md","occ","민수현"], [null, "vacant"], [null, "vacant"]],
  B:[["cre","occ","권유진"], ["cre","occ","곽수진"], [null, "vacant"], ["cre","occ","윤소정"], ["cre","occ","이종민"], ["cre","occ","박준희"], [null, "vacant"]],
  C:[["mkt","occ","김나영"],["mkt","occ","강다혜"],["mkt","occ","이원희"],["bm","occ","조성미"],["bm","occ","조민경"],["bm","occ","김연주"],["mkt","hiring","","마케팅팀장"],["mkt","occ","김은아"],["mkt","occ","최지윤"],["mkt","occ","박수연"],["mkt","occ","김현정"],["mkt","occ","강예지"]],
  D:[[null, "vacant"], ["sales","occ","박주현"], ["sales","occ","이다은"], ["sales","occ","류혜리"], ["sales","occ","ivvone"], ["exec","occ","최진석"], [null, "vacant"], [null, "vacant"], ["sourcing","occ","김권영"], ["sourcing","occ","정찬근"], ["ops","occ","안도영"], ["hr","occ","유하람"]]
};
const seats=[];
function addSeat(pod,x,z,w,d,face,pos){
  const i=seats.filter(s=>s.pod===pod).length, a=ASSIGN[pod][i]||[null,'vacant'];
  seats.push({id:pod+'-'+String(i+1).padStart(2,'0'),pod,idx:i,x,z,w,d,face,pos,team:a[0],status:a[1],name:a[2]||'',role:a[3]||''});
}
// A섬: 상단 가로형 4×2 (회의실B 오른쪽)
for(let r=0;r<2;r++) for(let i=0;i<4;i++) addSeat('A',18.6+1.17*(i+0.5),2.47+0.645*(r+0.5),1.17,0.645,r===0?'S':'N',`A섬 ${r===0?'북쪽':'남쪽'} 줄 ${i+1}번째`);
// B섬: 우측 세로형 3×2 + 하단 1석
for(let c=0;c<2;c++) for(let i=0;i<3;i++) addSeat('B',24.35+0.67*(c+0.5),1.94+1.54*(i+0.5),1.54,0.67,c===0?'E':'W',`B섬 ${c===0?'서쪽':'동쪽'} 줄 ${i+1}번째`);
addSeat('B',25.0,6.86,1.5,0.6,'N','B섬 끝자리 (수납벽3 앞)');
// C섬·D섬: 중앙 세로형 6×2
[['C',17.3],['D',21.2]].forEach(([p,x0])=>{
  for(let c=0;c<2;c++) for(let i=0;i<6;i++) addSeat(p,x0+0.7*(c+0.5),5.4+1.32*(i+0.5),1.32,0.7,c===0?'E':'W',`${p}섬 ${c===0?'서쪽':'동쪽'} 줄 ${i+1}번째`);
});
const count = st => seats.filter(s=>s.status===st).length;

/* ---------- three setup ---------- */
if(!window.THREE || !THREE.OrbitControls){ fail(); return; }
let renderer;
try{ renderer = new THREE.WebGLRenderer({antialias:true}); }catch(e){ fail(); return; }
function fail(){ view.insertAdjacentHTML('beforeend','<p class="fail">3D 화면을 불러오지 못했습니다. 브라우저를 새로고침해 주세요.</p>'); }

renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
view.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35,1,0.5,400);
camera.up.set(0,1,0);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = 1.36; controls.minDistance = 10; controls.maxDistance = 90;
controls.screenSpacePanning = false; controls.enabled = false;

scene.add(new THREE.HemisphereLight(0xffffff,0x8a9490,0.78));
const sun = new THREE.DirectionalLight(0xffffff,0.62);
sun.position.set(-12,30,14); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20,near:1,far:80});
sun.shadow.bias = -0.0006;
scene.add(sun);

const X = x=>x-W_TOT/2, Z = z=>z-D_TOT/2;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const M = {
  floor:new THREE.MeshStandardMaterial({roughness:0.95}),
  room:new THREE.MeshStandardMaterial({roughness:0.95}),
  wallSide:new THREE.MeshStandardMaterial({roughness:0.85}),
  wallTop:new THREE.MeshStandardMaterial({roughness:0.9}),
  furn:new THREE.MeshStandardMaterial({roughness:0.8}),
  store:new THREE.MeshStandardMaterial({roughness:0.8}),
  chair:new THREE.MeshStandardMaterial({roughness:0.7}),
  monitor:new THREE.MeshStandardMaterial({roughness:0.4}),
  plant:new THREE.MeshStandardMaterial({color:'#6E9A5B',roughness:0.9}),
  line:new THREE.LineBasicMaterial({transparent:true}),
  grid:new THREE.LineBasicMaterial({transparent:true}),
  tip:new THREE.MeshBasicMaterial({transparent:true})
};

/* floor (L자형) + 1 m grid */
[[0,0,WING_X,WING_Z],[WING_X,0,W_TOT-WING_X,D_TOT]].forEach(([x,z,w,d])=>{
  const f=new THREE.Mesh(new THREE.PlaneGeometry(w,d),M.floor);
  f.rotation.x=-Math.PI/2; f.position.set(X(x+w/2),0,Z(z+d/2)); f.receiveShadow=true; scene.add(f);
});
(function(){
  const pts=[];
  for(let x=1;x<W_TOT;x++){ const z2=x<WING_X?WING_Z:D_TOT; pts.push(X(x),0.01,Z(0),X(x),0.01,Z(z2)); }
  for(let z=1;z<D_TOT;z++){ const x1=z<WING_Z?0:WING_X; pts.push(X(x1),0.01,Z(z),X(W_TOT),0.01,Z(z)); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
  scene.add(new THREE.LineSegments(g,M.grid));
})();

/* room tiles (clickable) */
const roomTiles=[];
ROOMS.forEach(r=>{
  const m=new THREE.Mesh(new THREE.PlaneGeometry(r.w,r.d),M.room);
  m.rotation.x=-Math.PI/2; m.position.set(X(r.x+r.w/2),0.006,Z(r.z+r.d/2));
  m.receiveShadow=true; m.userData.room=r; scene.add(m); roomTiles.push(m);
});

/* ---------- plan geometry: line segments + solids ---------- */
const segs=[]; const rise=[];
const seg=(x1,z1,x2,z2,w)=>segs.push([x1,z1,x2,z2,w||1]);
const rect=(x,z,w,d,wt)=>{seg(x,z,x+w,z,wt);seg(x+w,z,x+w,z+d,wt);seg(x+w,z+d,x,z+d,wt);seg(x,z+d,x,z,wt);};
const circ=(cx,cz,r,wt)=>{const n=20;for(let i=0;i<n;i++){const a0=i/n*Math.PI*2,a1=(i+1)/n*Math.PI*2;seg(cx+r*Math.cos(a0),cz+r*Math.sin(a0),cx+r*Math.cos(a1),cz+r*Math.sin(a1),wt);}};
const arc=(f,wt)=>{const n=10;for(let i=0;i<n;i++){const a=f(i/n*Math.PI/2),b=f((i+1)/n*Math.PI/2);seg(a[0],a[1],b[0],b[1],wt);}};
const riseDelay=(x,z,base)=>base+(z/D_TOT)*0.1+(x/W_TOT)*0.07;

const WALL_T=0.18, WALL_H=1.5;
function wallPiece(x1,z1,x2,z2){
  seg(x1,z1,x2,z2,1.6);
  const horiz=z1===z2, L=Math.abs(horiz?x2-x1:z2-z1);
  const g=horiz?new THREE.BoxGeometry(L+WALL_T,WALL_H,WALL_T):new THREE.BoxGeometry(WALL_T,WALL_H,L+WALL_T);
  g.translate(0,WALL_H/2,0);
  const m=new THREE.Mesh(g,[M.wallSide,M.wallSide,M.wallTop,M.wallSide,M.wallSide,M.wallSide]);
  m.position.set(X((x1+x2)/2),0,Z((z1+z2)/2)); m.castShadow=true; m.receiveShadow=true;
  scene.add(m); rise.push({obj:m,delay:riseDelay((x1+x2)/2,(z1+z2)/2,0.04),span:0.36});
}
/* 벽 + 문 개구부: gaps = [[시작, 끝, 열림방향(+1/-1)]] */
function wall(x1,z1,x2,z2,gaps){
  const horiz=z1===z2, a0=horiz?Math.min(x1,x2):Math.min(z1,z2), a1=horiz?Math.max(x1,x2):Math.max(z1,z2);
  let cur=a0;
  (gaps||[]).slice().sort((p,q)=>p[0]-q[0]).forEach(([g0,g1,s])=>{
    if(g0>cur) horiz?wallPiece(cur,z1,g0,z1):wallPiece(x1,cur,x1,g0);
    const L=g1-g0;
    if(horiz){ seg(g0,z1,g0,z1+s*L,2); arc(p=>[g0+L*Math.sin(p),z1+s*L*Math.cos(p)],2); }
    else{ seg(x1,g0,x1+s*L,g0,2); arc(p=>[x1+s*L*Math.cos(p),g0+L*Math.sin(p)],2); }
    cur=g1;
  });
  if(cur<a1) horiz?wallPiece(cur,z1,a1,z1):wallPiece(x1,cur,x1,a1);
}
function box(x,z,w,d,h,mat,base){

const nSeg=segs.length;
const linePos=new Float32Array(nSeg*6), lineOrig=new Float32Array(nSeg*6);
const cum=new Float32Array(nSeg+1);
segs.forEach((s,i)=>{
  linePos.set([X(s[0]),0.02,Z(s[1]),X(s[2]),0.02,Z(s[3])],i*6);
  cum[i+1]=cum[i]+Math.hypot(s[2]-s[0],s[3]-s[1])*s[4];
});
lineOrig.set(linePos);
const lineGeo=new THREE.BufferGeometry();
lineGeo.setAttribute('position',new THREE.BufferAttribute(linePos,3));
const lines=new THREE.LineSegments(lineGeo,M.line); lines.frustumCulled=false; scene.add(lines);
const tip=new THREE.Mesh(new THREE.RingGeometry(0.1,0.22,28),M.tip);
tip.rotation.x=-Math.PI/2; tip.visible=false; scene.add(tip);
function setDraw(p){
  linePos.set(lineOrig);
  if(p>=1){ lineGeo.setDrawRange(0,nSeg*2); tip.visible=false; }
  else if(p<=0){ lineGeo.setDrawRange(0,0); tip.visible=false; }
  else{
    const target=p*cum[nSeg]; let k=0;
    while(k<nSeg-1 && cum[k+1]<target) k++;
    const f=(target-cum[k])/Math.max(1e-6,cum[k+1]-cum[k]);
    const o=k*6;
    for(let a=0;a<3;a++) linePos[o+3+a]=lineOrig[o+a]+(lineOrig[o+3+a]-lineOrig[o+a])*f;
    lineGeo.setDrawRange(0,(k+1)*2);
    tip.position.set(linePos[o+3],0.03,linePos[o+5]); tip.visible=true;
  }
  lineGeo.attributes.position.needsUpdate=true;
}

/* ---------- camera states ---------- */
let fitDist=40;
const TGT={x:0.6,z:-0.4};
const camPlan=()=>({theta:0,phi:0,dist:fitDist,tx:TGT.x,tz:TGT.z});
const cam3D=()=>({theta:0.92,phi:-0.26,dist:fitDist*(camera.aspect<1?1.05:1.04),tx:TGT.x-1.4,tz:TGT.z+1.6});
function applyCam(s){
  const sp=Math.sin(s.phi),cp=Math.cos(s.phi),st=Math.sin(s.theta),ct=Math.cos(s.theta);
  camera.position.set(s.tx+s.dist*st*sp, s.dist*ct, s.tz+s.dist*st*cp);
  camera.up.set(-ct*sp, st, -ct*cp);
  camera.lookAt(s.tx,0,s.tz);
}
function readCam(){
  const t=controls.target, ox=camera.position.x-t.x, oy=camera.position.y-t.y, oz=camera.position.z-t.z;
  const d=Math.hypot(ox,oy,oz);
  return {theta:Math.acos(Math.min(1,Math.max(-1,oy/d))),phi:(Math.abs(ox)+Math.abs(oz)<1e-6)?0:Math.atan2(ox,oz),dist:d,tx:t.x,tz:t.z};
}
function lerpCam(a,b,e){
  let dp=b.phi-a.phi; while(dp>Math.PI)dp-=2*Math.PI; while(dp<-Math.PI)dp+=2*Math.PI;
  return {theta:a.theta+(b.theta-a.theta)*e,phi:a.phi+dp*e,dist:a.dist+(b.dist-a.dist)*e,tx:a.tx+(b.tx-a.tx)*e,tz:a.tz+(b.tz-a.tz)*e};
}
function resize(){
  const w=view.clientWidth,h=view.clientHeight; if(!w||!h) return;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
  const t=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  fitDist=Math.max(9.4/t, 15.8/(t*camera.aspect));
  if(mode==='plan'||mode==='drawing') applyCam(camPlan());
}

/* ---------- tweens + sequence ---------- */
let tweens=[];
const tween=(dur,fn,done)=>tweens.push({start:performance.now(),dur:Math.max(1,dur),fn,done});
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,3);
let drawP=0, riseT=0, labelAlpha=0, gridAlpha=0, mode='drawing';
const setPhase=t=>{phaseText.textContent=t;};
function setButtons(){ btnPlan.setAttribute('aria-pressed',String(mode==='plan')); btn3d.setAttribute('aria-pressed',String(mode==='3d')); }

function finishTo3D(to){
  camera.up.set(0,1,0); camera.lookAt(to.tx,0,to.tz);
  controls.target.set(to.tx,0,to.tz); controls.update(); controls.enabled=true;
  mode='3d'; setPhase('3D 보기'); setButtons();
}
function go3D(dur){
  controls.enabled=false; mode='anim'; setPhase('입체로 세우는 중');
  const from=readCam(), to=cam3D(), r0=riseT;
  if(dur<=0||reduceMotion){ riseT=1; applyCam(to); finishTo3D(to); return; }
  tween(dur,t=>{ applyCam(lerpCam(from,to,easeIO(t))); riseT=r0+(1-r0)*t; },()=>finishTo3D(to));
}
function goPlan(dur){
  controls.enabled=false; mode='anim'; setPhase('평면으로 내리는 중');
  const from=readCam(), to=camPlan(), r0=riseT;
  const done=()=>{ applyCam(to); controls.target.set(to.tx,0,to.tz); mode='plan'; setPhase('평면 보기'); setButtons(); };
  if(dur<=0||reduceMotion){ riseT=0; done(); return; }
  tween(dur,t=>{ applyCam(lerpCam(from,to,easeIO(t))); riseT=r0*(1-t); },done);
}
function ensureDrawn(){ tweens=[]; drawP=1; labelAlpha=1; gridAlpha=1; setDraw(1); }
function intro(){
  tweens=[]; controls.enabled=false; mode='drawing'; setButtons();
  controls.target.set(TGT.x,0,TGT.z);
  riseT=0; drawP=0; labelAlpha=0; gridAlpha=0; setDraw(0); applyCam(camPlan());
  if(reduceMotion){ ensureDrawn(); go3D(0); return; }
  setPhase('평면 작도 중');
  tween(450,t=>{gridAlpha=t;},()=>{
    tween(4200,t=>{drawP=easeIO(t); setDraw(drawP);},()=>{
      setDraw(1); setPhase('실 이름 기입');
      tween(600,t=>{labelAlpha=t;},()=>go3D(2600));
    });
  });
}
btnPlan.addEventListener('click',()=>{ if(mode==='plan') return; if(drawP<1) ensureDrawn(); goPlan(1300); });
btn3d.addEventListener('click',()=>{ if(mode==='3d') return; if(drawP<1) ensureDrawn(); go3D(1500); });
btnReplay.addEventListener('click',intro);

/* ---------- picking ---------- */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
function pick(ev){
  const r=renderer.domElement.getBoundingClientRect();
  ndc.set(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  const d=ray.intersectObjects(deskPick,false)[0]; if(d) return {seat:d.object.userData.seat};
  const rm=ray.intersectObjects(roomTiles,false)[0]; if(rm) return {room:rm.object.userData.room};
  return null;
}
let down=null;
const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};});
cv.addEventListener('pointerup',e=>{
  if(!down) return; const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y); down=null;
  if(moved>6) return;
  const h=pick(e);
  if(h&&h.seat) selectSeat(h.seat); else if(h&&h.room) selectRoom(h.room); else { selectSeat(null); }
});
let hoverQueued=false,lastMove=null;
cv.addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse') return; lastMove=e;
  if(hoverQueued) return; hoverQueued=true;
  requestAnimationFrame(()=>{ hoverQueued=false; if(!lastMove) return; const h=pick(lastMove); cv.style.cursor=h?'pointer':(controls.enabled?'grab':'default'); });
});
addEventListener('keydown',e=>{ if(e.key==='Escape'){ selectSeat(null); } });

/* ---------- overlay tag ---------- */
const v3=new THREE.Vector3();
function updateTag(){
  if(!selected){ tagEl.hidden=true; return; }
  const s=selected;
  tagEl.innerHTML=`<b>${s.id}</b>${s.status==='occ'?esc(s.name):s.status==='hiring'?'채용 예정':'공석'}`;
  v3.set(X(s.x),0.12+s.group.scale.y*1.15,Z(s.z)).project(camera);
  if(v3.z>1){ tagEl.hidden=true; return; }
  tagEl.hidden=false;
  tagEl.style.left=((v3.x+1)/2*view.clientWidth)+'px';
  tagEl.style.top=((1-v3.y)/2*view.clientHeight)+'px';
}

/* ---------- loop ---------- */
function frame(now){
  if(tweens.length){
    const list=tweens.slice();
    list.forEach(tw=>{
      if(tweens.indexOf(tw)<0) return;
      const t=Math.min(1,(now-tw.start)/tw.dur); tw.fn(t);
      if(t>=1){ tweens.splice(tweens.indexOf(tw),1); if(tw.done) tw.done(); }
    });
  }
  if(controls.enabled) controls.update();
  rise.forEach(it=>{
    const p=Math.min(1,Math.max(0,(riseT-it.delay)/it.span)), e=easeOut(p);
    it.obj.scale.y=Math.max(0.0001,e); it.obj.visible=e>0.002;
  });
  M.line.opacity=1-0.62*riseT;
  M.grid.opacity=gridAlpha*(1-0.45*riseT);
  M.tip.opacity=1;
  labelMats.forEach(m=>m.opacity=labelAlpha);
  if(selected) updateTag();
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
applyTheme();
renderStats();
renderInfo();
new ResizeObserver(resize).observe(view);
resize();
intro();
const fontsReady = document.fonts ? Promise.race([
  Promise.all([document.fonts.load("600 72px Pretendard","회의실"),document.fonts.load("500 72px Inter","A30")]),
  new Promise(r=>setTimeout(r,1800))]) : Promise.resolve();
fontsReady.catch(()=>{}).then(buildLabels);
requestAnimationFrame(frame);
})();
</script>
