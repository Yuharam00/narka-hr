<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>나르카 회의실 예약</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: 회의실을 열로 둔 일간 시간표 + 우측 예약 패널 (HARAM Design System 토큰, 인사팀 허브와 동일한 강조색) */
:root{
  --bg:#FAFAF8;--surface:#FFFFFF;--sunken:#F3F3F0;--fg:#202020;--muted:#737373;--faint:#A3A3A0;
  --line:#E8E8E5;--line-strong:#D6D6D1;--accent:#3B3F9E;--accent-soft:#EEEFF8;--on-accent:#FFFFFF;
  --warn:#B7791F;--warn-soft:#FBF3E4;--err:#EF4444;--err-soft:#FDECEC;
  --kr:"Pretendard","Pretendard Variable","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --en:"Inter","Pretendard",-apple-system,sans-serif;
  --r-sm:4px;--r-md:8px;--ease:cubic-bezier(.2,.7,.2,1);--slot:30px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--surface:#1C1C1B;--sunken:#232322;--fg:#EDEDEB;--muted:#A3A3A0;--faint:#6B6B68;
  --line:#2C2C2A;--line-strong:#3A3A38;--accent:#9EA3F0;--accent-soft:#23243A;--on-accent:#141413;
  --warn:#E3B062;--warn-soft:#2E261A;--err:#F87171;--err-soft:#331C1C;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141413;--surface:#1C1C1B;--sunken:#232322;--fg:#EDEDEB;--muted:#A3A3A0;--faint:#6B6B68;
  --line:#2C2C2A;--line-strong:#3A3A38;--accent:#9EA3F0;--accent-soft:#23243A;--on-accent:#141413;
  --warn:#E3B062;--warn-soft:#2E261A;--err:#F87171;--err-soft:#331C1C;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.6 var(--kr);letter-spacing:-.01em;
  word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px 64px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:28px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;color:inherit;text-decoration:none}
.brand b{font:600 20px var(--en);letter-spacing:-.03em}
.brand span,.top a.home{font-size:14px;color:var(--muted)}
.top a.home{text-decoration:none}.top a.home:hover{color:var(--fg)}
.demo{margin-top:16px;padding:10px 12px;background:var(--warn-soft);color:var(--warn);border-radius:var(--r-sm);font-size:14px}
.head{padding:40px 0 24px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
h1{margin:0;font-size:32px;line-height:1.25;font-weight:700;letter-spacing:-.035em}
.head p{margin:6px 0 0;color:var(--muted)}
.datebar{display:flex;align-items:center;gap:8px}
.btn{height:40px;padding:0 14px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);cursor:pointer;
  transition:border-color .2s var(--ease),background .2s var(--ease),color .2s var(--ease)}
.btn:hover{border-color:var(--line-strong)}
.btn:focus-visible,.field:focus-visible,.slot:focus-visible,.check input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.icon{width:40px;padding:0}
.btn.primary{width:100%;height:46px;background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}
.btn.primary:hover{opacity:.92}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.danger{color:var(--err);height:32px;font-size:13px;padding:0 10px}
.datepick{width:150px;font-family:var(--en);font-variant-numeric:tabular-nums}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}

/* 시간표 */
.board{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.board-head,.board-body{display:grid;grid-template-columns:52px repeat(3,minmax(0,1fr))}
.board-head{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:3}
.board-head div{padding:12px 8px;border-left:1px solid var(--line)}
.board-head div:first-child{border-left:0}
.board-head strong{display:block;font-size:15px;font-weight:600}
.board-head span{font-size:13px;color:var(--muted)}
.times{position:relative}
.times span{position:absolute;right:8px;transform:translateY(-50%);font:400 12px var(--en);color:var(--muted);font-variant-numeric:tabular-nums}
.times span:first-child{transform:none}
.col{position:relative;border-left:1px solid var(--line)}
.slot{display:block;width:100%;height:var(--slot);padding:0;border:0;border-top:1px solid transparent;background:none;cursor:pointer;transition:background .15s var(--ease)}
.slot.hour{border-top-color:var(--line)}
.slot:first-child{border-top-color:transparent}
.slot:hover:not(:disabled){background:var(--accent-soft)}
.slot.sel{background:var(--accent-soft)}
.slot:disabled{cursor:not-allowed;background:var(--sunken)}
.bk{position:absolute;left:3px;right:3px;padding:4px 7px;background:var(--sunken);border-left:2px solid var(--faint);border-radius:var(--r-sm);
  overflow:hidden;font-size:13px;line-height:1.35;z-index:1}
.bk b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk span{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk.mine{background:var(--accent-soft);border-left-color:var(--accent)}
.bk.mine b{color:var(--accent)}
.now{position:absolute;left:0;right:0;height:0;border-top:1.5px solid var(--err);z-index:2;pointer-events:none}
.loading{opacity:.5;transition:opacity .2s}

/* 예약 패널 */
.panel{position:sticky;top:24px}
.panel h2,.mine-list h2{margin:0 0 16px;font-size:20px;font-weight:600;letter-spacing:-.02em}
label.l{display:block;margin:0 0 14px;font-size:14px;color:var(--muted)}
.field{display:block;width:100%;height:42px;margin-top:6px;padding:0 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);color:var(--fg);font-size:15px}
.field:hover{border-color:var(--line-strong)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.picker{position:relative}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 4px 2px 8px;background:var(--sunken);border-radius:var(--r-sm);font-size:13px;color:var(--fg)}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);width:20px;height:20px;line-height:1;padding:0}
.suggest{position:absolute;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:0 8px 24px rgba(0,0,0,.08);max-height:220px;overflow:auto;z-index:5}
.suggest button{display:flex;justify-content:space-between;gap:12px;width:100%;padding:8px;border:0;background:none;border-radius:var(--r-sm);cursor:pointer;text-align:left;color:var(--fg);font-size:14px}
.suggest button:hover,.suggest button.on{background:var(--accent-soft)}
.suggest small{color:var(--muted);font:400 12px var(--en)}
.check{display:flex;gap:8px;align-items:flex-start;margin:0 0 16px;font-size:14px;color:var(--fg);cursor:pointer}
.check input{margin:4px 0 0;accent-color:var(--accent)}
.check small{display:block;color:var(--muted);font-size:13px}
.warn{margin:-6px 0 14px;padding:8px 10px;background:var(--warn-soft);color:var(--warn);border-radius:var(--r-sm);font-size:13px}
.note{margin:10px 0 0;font-size:13px;color:var(--muted)}

/* 내 예약 */
.mine-list{margin-top:48px;padding-top:24px;border-top:1px solid var(--fg)}
.mine-list ul{list-style:none;margin:0;padding:0}
.mine-list li{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.mine-list time{font:400 14px var(--en);color:var(--muted);font-variant-numeric:tabular-nums}
.mine-list em{font-style:normal;color:var(--muted);font-size:14px;margin-left:8px}
.empty{color:var(--muted);padding:12px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);max-width:calc(100vw - 32px);padding:12px 16px;background:var(--fg);color:var(--bg);border-radius:var(--r-md);font-size:14px;opacity:0;pointer-events:none;transition:all .25s var(--ease);z-index:10}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--err);color:#fff}
@media (max-width:900px){
  .layout{grid-template-columns:1fr;gap:32px}
  .panel{position:static}
}
@media (max-width:640px){
  .wrap{padding:0 16px 48px}
  .top{padding:20px 0}
  .head{padding:28px 0 20px}
  h1{font-size:26px}
  .datebar{width:100%}.datepick{flex:1;width:auto;min-width:0}
  .board-head,.board-body{grid-template-columns:42px repeat(3,minmax(0,1fr))}
  .board-head div{padding:10px 6px}.board-head strong{font-size:14px}
  .mine-list li{grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
  .mine-list li time{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="https://yuharam00.github.io/narka-hr/" target="_top"><b>narka</b><span>회의실 예약</span></a>
    <a class="home" href="https://yuharam00.github.io/narka-hr/" target="_top">인사팀 홈</a>
  </header>
  <div class="demo" id="demo" hidden>미리보기입니다. 예시 데이터로 동작하며 실제 캘린더와 슬랙에는 전송되지 않습니다.</div>

  <section class="head">
    <div><h1 id="dateTitle">회의실 예약</h1><p id="meLine">불러오는 중입니다.</p></div>
    <div class="datebar">
      <button class="btn icon" id="prev" aria-label="이전 날짜">&#8249;</button>
      <input class="btn datepick" type="date" id="date" aria-label="날짜 선택">
      <button class="btn icon" id="next" aria-label="다음 날짜">&#8250;</button>
      <button class="btn" id="todayBtn">오늘</button>
    </div>
  </section>

  <div class="layout">
    <main>
      <div class="board" id="board" aria-label="회의실별 예약 시간표">
        <div class="board-head" id="boardHead"></div>
        <div class="board-body" id="boardBody"></div>
      </div>
    </main>

    <aside class="panel" id="panel">
      <h2>예약하기</h2>
      <form id="form" autocomplete="off">
        <label class="l">회의명<input class="field" id="title" maxlength="80" required placeholder="예: 주간 팀 회의"></label>
        <label class="l">회의실<select class="field" id="room"></select></label>
        <div class="two">
          <label class="l">시작<select class="field" id="start"></select></label>
          <label class="l">종료<select class="field" id="end"></select></label>
        </div>
        <div class="l picker">
          <label for="who">참석자 초대</label>
          <input class="field" id="who" placeholder="이름 또는 이메일 입력" role="combobox" aria-expanded="false" aria-controls="suggest">
          <ul class="suggest" id="suggest" hidden></ul>
          <div class="chips" id="chips"></div>
        </div>
        <div class="warn" id="capWarn" hidden></div>
        <label class="check"><input type="checkbox" id="private">
          <span>비공개 예약<small>회의명·참석자를 시간표와 슬랙에 표시하지 않습니다. 면담 등에 사용하세요.</small></span></label>
        <button class="btn primary" id="submit" type="submit">예약하고 초대 보내기</button>
        <p class="note" id="flowNote"></p>
      </form>
    </aside>
  </div>

  <section class="mine-list">
    <h2>내 예약</h2>
    <ul id="mine"></ul>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const W=['일','월','화','수','목','금','토'];
const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const toTime=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const parseD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmtD=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return fmtD(d)};
const SLOT=()=>parseInt(getComputedStyle(document.documentElement).getPropertyValue('--slot'),10);

/* 서버 호출. 앱스 스크립트 밖(미리보기)에서는 예시 데이터로 동작합니다. */
const isGas=typeof google!=='undefined'&&google.script&&google.script.run;
const api=isGas
 ?(fn,...a)=>new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(e=>no(e))[fn](...a))
 :demoApi();

let S={boot:null,date:null,bookings:[],guests:[],active:-1};

function toast(msg,err){const t=$('toast');t.textContent=msg;t.className='toast show'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='toast',3600)}
const errMsg=e=>String(e&&e.message||e).replace(/^Error:\s*/,'');
function nowInfo(){const d=new Date(Date.now()+new Date().getTimezoneOffset()*60000+9*3600000);return{date:fmtD(d),min:d.getHours()*60+d.getMinutes()}}
const minDate=()=>S.boot.openFrom>S.boot.today?S.boot.openFrom:S.boot.today;

function renderDate(){
  const d=parseD(S.date);
  $('dateTitle').textContent=(d.getMonth()+1)+'월 '+d.getDate()+'일 '+W[d.getDay()]+'요일';
  $('date').value=S.date;$('date').min=minDate();
  $('prev').disabled=S.date<=minDate();
}
function renderBoard(){
  const b=S.boot,n=nowInfo(),slot=SLOT();
  const hs=b.hourStart*60,total=(b.hourEnd-b.hourStart)*2;
  $('boardHead').innerHTML='<div></div>'+b.rooms.map(r=>'<div><strong>'+r.name+'</strong><span>'+r.capacity+'인</span></div>').join('');
  const body=$('boardBody');body.textContent='';
  const times=document.createElement('div');times.className='times';times.style.height=total*slot+'px';
  for(let h=b.hourStart;h<b.hourEnd;h++){const s=document.createElement('span');s.style.top=(h-b.hourStart)*2*slot+'px';s.textContent=pad(h)+':00';times.appendChild(s)}
  body.appendChild(times);
  const selRoom=$('room').value,selS=$('start').value,selE=$('end').value;
  b.rooms.forEach(r=>{
    const col=document.createElement('div');col.className='col';
    const list=S.bookings.filter(x=>x.roomKey===r.key);
    for(let i=0;i<total;i++){
      const m=hs+i*30,t=toTime(m),btn=document.createElement('button');
      btn.type='button';btn.className='slot'+(i%2===0?' hour':'');
      btn.setAttribute('aria-label',r.name+' '+t+' 예약');
      const past=S.date===n.date&&m+30<=n.min, busy=list.some(x=>toMin(x.start)<m+30&&toMin(x.end)>m);
      btn.disabled=past||busy;
      if(r.key===selRoom&&selS&&m>=toMin(selS)&&m<toMin(selE))btn.classList.add('sel');
      btn.addEventListener('click',()=>pickSlot(r.key,m));
      col.appendChild(btn);
    }
    list.forEach(x=>{
      const top=Math.max(0,toMin(x.start)-hs)/30*slot,h=Math.max(slot,(toMin(x.end)-Math.max(toMin(x.start),hs))/30*slot);
      const el=document.createElement('div');el.className='bk'+(x.mine?' mine':'');el.style.top=top+1+'px';el.style.height=h-2+'px';
      const bt=document.createElement('b');bt.textContent=x.title;el.appendChild(bt);
      const sp=document.createElement('span');sp.textContent=x.start+'~'+x.end+(x.ownerName?' · '+x.ownerName:'');el.appendChild(sp);
      el.title=x.title+'\n'+x.start+'~'+x.end+(x.ownerName?'\n예약자 '+x.ownerName:'')+(x.guestNames?'\n참석 '+x.guestNames:'');
      col.appendChild(el);
    });
    if(S.date===n.date&&n.min>=hs&&n.min<=b.hourEnd*60){const l=document.createElement('div');l.className='now';l.style.top=(n.min-hs)/30*slot+'px';col.appendChild(l)}
    body.appendChild(col);
  });
}
function pickSlot(room,m){
  $('room').value=room;
  fillStart();$('start').value=toTime(m);fillEnd();
  const lim=nextBusy(room,m);$('end').value=toTime(Math.min(m+60,lim,S.boot.hourEnd*60));
  renderBoard();
  if(window.matchMedia('(max-width:900px)').matches)$('panel').scrollIntoView({behavior:'smooth',block:'start'});
  $('title').focus({preventScroll:true});
}
function nextBusy(room,m){return S.bookings.filter(x=>x.roomKey===room&&toMin(x.start)>m).reduce((a,x)=>Math.min(a,toMin(x.start)),S.boot.hourEnd*60)}
function fillStart(){
  const b=S.boot,n=nowInfo(),cur=$('start').value,opts=[];
  for(let m=b.hourStart*60;m<b.hourEnd*60;m+=30){if(S.date===n.date&&m<n.min)continue;opts.push(toTime(m))}
  $('start').innerHTML=opts.map(t=>'<option>'+t+'</option>').join('');
  if(opts.includes(cur))$('start').value=cur;
}
function fillEnd(){
  const s=$('start').value,cur=$('end').value;if(!s){$('end').innerHTML='';return}
  const opts=[];for(let m=toMin(s)+30;m<=S.boot.hourEnd*60;m+=30)opts.push(toTime(m));
  $('end').innerHTML=opts.map(t=>'<option>'+t+'</option>').join('');
  $('end').value=opts.includes(cur)?cur:opts[Math.min(1,opts.length-1)];
}
function capCheck(){
  const r=S.boot.rooms.find(x=>x.key===$('room').value),n=S.guests.length+1,w=$('capWarn');
  if(r&&n>r.capacity){w.hidden=false;w.textContent=r.name+' 수용 인원('+r.capacity+'인)보다 참석자가 많습니다. 현재 '+n+'명입니다.'}else w.hidden=true;
}
function renderChips(){
  const c=$('chips');c.textContent='';
  S.guests.forEach(g=>{
    const sp=document.createElement('span');sp.className='chip';sp.textContent=g.name;
    const x=document.createElement('button');x.type='button';x.textContent='×';x.setAttribute('aria-label',g.name+' 제외');
    x.addEventListener('click',()=>{S.guests=S.guests.filter(y=>y.email!==g.email);renderChips()});
    sp.appendChild(x);c.appendChild(sp);
  });
  capCheck();
}
function addGuest(g){
  if(g.email===S.boot.me.email){toast('예약자는 자동으로 포함됩니다.')}
  else if(!S.guests.some(x=>x.email===g.email))S.guests.push(g);
  $('who').value='';closeSuggest();renderChips();$('who').focus();
}
function closeSuggest(){$('suggest').hidden=true;$('who').setAttribute('aria-expanded','false');S.active=-1}
function suggest(){
  const q=$('who').value.trim().toLowerCase(),ul=$('suggest');ul.textContent='';S.active=-1;
  if(!q){closeSuggest();return}
  const list=S.boot.members.filter(m=>(m.name+' '+m.email).toLowerCase().includes(q)&&!S.guests.some(g=>g.email===m.email)).slice(0,8);
  list.forEach(m=>{
    const li=document.createElement('li'),b=document.createElement('button');b.type='button';b.dataset.email=m.email;
    b.textContent=m.name;const s=document.createElement('small');s.textContent=m.email;b.appendChild(s);
    b.addEventListener('mousedown',e=>{e.preventDefault();addGuest(m)});li.appendChild(b);ul.appendChild(li);
  });
  ul.hidden=!list.length;$('who').setAttribute('aria-expanded',String(!!list.length));
}
function whoKey(e){
  const btns=[...$('suggest').querySelectorAll('button')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    if(!btns.length)return;e.preventDefault();
    S.active=(S.active+(e.key==='ArrowDown'?1:-1)+btns.length)%btns.length;
    btns.forEach((b,i)=>b.classList.toggle('on',i===S.active));
  }else if(e.key==='Enter'){
    e.preventDefault();
    if(S.active>=0)btns[S.active].dispatchEvent(new MouseEvent('mousedown',{cancelable:true}));
    else if(btns.length===1)btns[0].dispatchEvent(new MouseEvent('mousedown',{cancelable:true}));
    else{
      const v=$('who').value.trim().toLowerCase();if(!v)return;
      const email=v.includes('@')?v:v+'@'+S.boot.domain;
      if(!email.endsWith('@'+S.boot.domain)){toast('회사 계정만 초대할 수 있습니다.',true);return}
      addGuest({email,name:email.split('@')[0]});
    }
  }else if(e.key==='Escape')closeSuggest();
}
async function loadDay(){
  renderDate();fillStart();fillEnd();
  $('board').classList.add('loading');
  const asked=S.date;
  try{const list=await api('getBookings',asked);if(asked!==S.date)return;S.bookings=list}
  catch(e){toast(errMsg(e),true);S.bookings=[]}
  $('board').classList.remove('loading');renderBoard();
}
async function loadMine(){
  const ul=$('mine');
  try{
    const list=await api('getMyBookings');ul.textContent='';
    if(!list.length){const li=document.createElement('p');li.className='empty';li.textContent='예정된 예약이 없습니다.';ul.appendChild(li);return}
    list.forEach(x=>{
      const r=S.boot.rooms.find(y=>y.key===x.roomKey),d=parseD(x.date);
      const li=document.createElement('li');
      const t=document.createElement('time');t.textContent=(d.getMonth()+1)+'/'+d.getDate()+' ('+W[d.getDay()]+') '+x.start+'~'+x.end;
      const m=document.createElement('div');m.textContent=x.title;const em=document.createElement('em');em.textContent=r.name+(x.isPrivate?' · 비공개':'');m.appendChild(em);
      const c=document.createElement('button');c.className='btn danger';c.type='button';c.textContent='취소';
      c.addEventListener('click',()=>{
        if(c.dataset.arm!=='1'){c.dataset.arm='1';c.textContent='한 번 더 누르면 취소';setTimeout(()=>{c.dataset.arm='';c.textContent='취소'},3000);return}
        c.disabled=true;api('cancelBooking',x.roomKey,x.id).then(()=>{toast('예약을 취소했습니다. 슬랙 채널에도 공유됩니다.');loadDay();loadMine()}).catch(e=>{c.disabled=false;toast(errMsg(e),true)});
      });
      li.append(t,m,c);ul.appendChild(li);
    });
  }catch(e){toast(errMsg(e),true)}
}
async function submit(e){
  e.preventDefault();
  const btn=$('submit'),p={roomKey:$('room').value,date:S.date,start:$('start').value,end:$('end').value,title:$('title').value,attendees:S.guests.map(g=>g.email),isPrivate:$('private').checked};
  btn.disabled=true;btn.textContent='예약 중입니다';
  try{
    const res=await api('createBooking',p);
    toast(res.slackOk?'예약했습니다. 참석자 캘린더와 슬랙에 공유됩니다.':'예약하고 초대를 보냈습니다. 슬랙 전송은 실패했습니다.');
    $('title').value='';$('private').checked=false;S.guests=[];renderChips();
    await loadDay();await loadMine();
  }catch(err){toast(errMsg(err),true);loadDay()}
  btn.disabled=false;btn.textContent='예약하고 초대 보내기';
}
function go(d){if(d<minDate())d=minDate();S.date=d;loadDay()}

async function init(){
  if(!isGas)$('demo').hidden=false;
  try{S.boot=await api('getBootstrap')}catch(e){$('meLine').textContent=errMsg(e);return}
  const b=S.boot;
  $('meLine').textContent=b.me.name+'님으로 접속 중입니다. 빈 시간을 누르면 예약이 시작됩니다.';
  $('flowNote').textContent='초대한 분의 구글 캘린더에 자동 등록되고, 슬랙 채널에 공유된 뒤 시작 '+b.remindMinutes+'분 전 다시 알립니다.';
  $('room').innerHTML=b.rooms.map(r=>'<option value="'+r.key+'">'+r.name+' ('+r.capacity+'인)</option>').join('');
  $('prev').onclick=()=>go(addDays(S.date,-1));$('next').onclick=()=>go(addDays(S.date,1));
  $('todayBtn').onclick=()=>go(minDate());
  $('date').addEventListener('change',e=>e.target.value&&go(e.target.value));
  $('room').addEventListener('change',()=>{capCheck();renderBoard()});
  $('start').addEventListener('change',()=>{fillEnd();renderBoard()});
  $('end').addEventListener('change',renderBoard);
  $('who').addEventListener('input',suggest);$('who').addEventListener('keydown',whoKey);$('who').addEventListener('blur',()=>setTimeout(closeSuggest,120));
  $('form').addEventListener('submit',submit);
  S.date=minDate();await loadDay();loadMine();
  setInterval(()=>{if(document.visibilityState==='visible')loadDay()},60000);
}

/* 미리보기 전용 예시 데이터 */
function demoApi(){
  const today=fmtD(new Date(Date.now()+new Date().getTimezoneOffset()*60000+9*3600000));
  const open='2026-11-26',first=open>today?open:today;let seq=10;
  const me={email:'sample@uncmhm.com',name:'이예시'};
  const members=[me,{email:'hong@uncmhm.com',name:'홍길동'},{email:'kim@uncmhm.com',name:'김하나'},{email:'park@uncmhm.com',name:'박두리'},{email:'lee@uncmhm.com',name:'이세나'}];
  const rows=[
    {id:'1',roomKey:'big',date:first,start:'10:00',end:'11:30',title:'전사 월간 회의',ownerName:'홍길동',guestNames:'김하나, 박두리',mine:false,isPrivate:false},
    {id:'2',roomKey:'a',date:first,start:'14:00',end:'15:00',title:'비공개 회의',ownerName:'',guestNames:'',mine:false,isPrivate:true},
    {id:'3',roomKey:'b',date:first,start:'11:00',end:'12:00',title:'주간 팀 회의',ownerName:me.name,guestNames:'김하나',mine:true,isPrivate:false},
  ];
  const fns={
    getBootstrap:()=>({me,rooms:[{key:'big',name:'대회의실',capacity:12},{key:'a',name:'회의실 A',capacity:6},{key:'b',name:'회의실 B',capacity:6}],today,openFrom:open,hourStart:8,hourEnd:21,domain:'uncmhm.com',remindMinutes:10,members}),
    getBookings:d=>rows.filter(r=>r.date===d),
    getMyBookings:()=>rows.filter(r=>r.mine).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)),
    createBooking:p=>{
      if(!p.title.trim())throw new Error('회의명은 1~80자로 입력해 주세요.');
      if(rows.some(r=>r.roomKey===p.roomKey&&r.date===p.date&&r.start<p.end&&r.end>p.start))throw new Error('방금 다른 예약이 등록된 시간입니다. 다른 시간을 선택해 주세요.');
      const b={id:String(++seq),roomKey:p.roomKey,date:p.date,start:p.start,end:p.end,title:p.title,ownerName:me.name,guestNames:'',mine:true,isPrivate:p.isPrivate};rows.push(b);return{booking:b,slackOk:true}},
    cancelBooking:(k,id)=>{rows.splice(rows.findIndex(r=>r.id===id),1);return true},
  };
  return async(fn,...a)=>{await new Promise(r=>setTimeout(r,80));return fns[fn](...a)};
}
init();
})();
