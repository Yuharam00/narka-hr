/* HARAM Design System — 나르카 프리미엄 디자인 시스템 보드 기준
   Layout: 오프화이트 바탕 위 흰 면(카드)으로 정리한 브랜드형 온보딩. 메인은 웰컴 카드 + 5단계 + 문서 묶음, 상세는 좌측 사이드바 + 문서 카드.
   Primary는 '브랜드별 지정' 슬롯 — 나르카 옐로를 넣었다. --primary 계열만 바꾸면 전체가 바뀐다. */
:root{
  /* Color System */
  --bg:#FAFAF8;
  --surface:#FFFFFF;
  --surface-2:#F5F5F2;
  --surface-3:#EFEFEB;
  --text:#202020;
  --text-2:#737373;
  --text-3:#A3A3A0;
  --border:#E8E8E5;
  --border-2:#DADAD5;
  --primary:#F2C230;          /* 브랜드별 지정 — 나르카 옐로 */
  --primary-hover:#E5B41F;
  --on-primary:#202020;
  --primary-soft:#FDF5D8;
  --primary-text:#8A6400;     /* 흰 바탕 위 강조 글자 */
  --success:#10B981; --success-soft:#E7F8F1; --success-text:#047857;
  --warning:#F59E0B; --warning-soft:#FEF4E2; --warning-text:#B45309;
  --error:#EF4444;   --error-soft:#FDECEC;   --error-text:#C53030;
  --info:#3B82F6;    --info-soft:#EAF2FE;    --info-text:#2563EB;
  --scrim:rgba(32,32,32,.4);
  --desk:#F1ECE2;
  /* Typography */
  --font:"Inter","Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --hand:"Caveat","Inter",cursive;
  /* Radius: 4 · 8 · 12 · 16 */
  --r-4:4px; --r-8:8px; --r-12:12px; --r-16:16px;
  /* Shadow */
  --sh-card:0 1px 2px rgba(32,32,32,.04),0 6px 20px -8px rgba(32,32,32,.08);
  --sh-pop:0 2px 6px rgba(32,32,32,.06),0 20px 48px -16px rgba(32,32,32,.24);
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141414;--surface:#1C1C1C;--surface-2:#232323;--surface-3:#2A2A2A;--text:#EDEDEB;--text-2:#A3A3A0;--text-3:#737373;--border:#2C2C2C;--border-2:#3A3A3A;
  --primary:#F2C230;--primary-hover:#F6D25E;--on-primary:#202020;--primary-soft:#2E2710;--primary-text:#F2C230;
  --success-soft:#11291F;--success-text:#34D399;--warning-soft:#2E2210;--warning-text:#FBBF24;--error-soft:#2F1515;--error-text:#F87171;--info-soft:#14213A;--info-text:#60A5FA;
  --scrim:rgba(0,0,0,.6);--desk:#25221C;--sh-card:0 1px 2px rgba(0,0,0,.3);--sh-pop:0 2px 6px rgba(0,0,0,.4),0 20px 48px -16px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141414;--surface:#1C1C1C;--surface-2:#232323;--surface-3:#2A2A2A;--text:#EDEDEB;--text-2:#A3A3A0;--text-3:#737373;--border:#2C2C2C;--border-2:#3A3A3A;
  --primary:#F2C230;--primary-hover:#F6D25E;--on-primary:#202020;--primary-soft:#2E2710;--primary-text:#F2C230;
  --success-soft:#11291F;--success-text:#34D399;--warning-soft:#2E2210;--warning-text:#FBBF24;--error-soft:#2F1515;--error-text:#F87171;--info-soft:#14213A;--info-text:#60A5FA;
  --scrim:rgba(0,0,0,.6);--desk:#25221C;--sh-card:0 1px 2px rgba(0,0,0,.3);--sh-pop:0 2px 6px rgba(0,0,0,.4),0 20px 48px -16px rgba(0,0,0,.7);color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.7;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--surface)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary-text);outline-offset:2px;border-radius:var(--r-4)}
.g{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}

/* ---------- Typography scale (보드 기준) ---------- */
.t-display{font-size:clamp(40px,5vw,56px);line-height:1.12;letter-spacing:-.035em;font-weight:700;margin:0}
.t-h1{font-size:clamp(30px,3.4vw,40px);line-height:1.2;letter-spacing:-.03em;font-weight:700;margin:0}
.t-h2{font-size:clamp(23px,2.4vw,28px);line-height:1.3;letter-spacing:-.025em;font-weight:600;margin:0}
.t-h3{font-size:20px;line-height:1.4;letter-spacing:-.02em;font-weight:600;margin:0}
.t-body{font-size:16px;line-height:1.7}
.t-cap{font-size:14px;line-height:1.55;color:var(--text-2)}
.t-over{font-size:13px;font-weight:500;color:var(--text-2);letter-spacing:0}

/* ---------- Buttons / badges ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:var(--r-8);font-size:15px;font-weight:600;text-decoration:none;cursor:pointer;border:1px solid var(--border-2);background:var(--surface);color:var(--text);transition:background-color .15s var(--ease),border-color .15s,transform .15s;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn--primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn--primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn--ghost{background:transparent;border-color:transparent}
.btn--sm{height:36px;padding:0 14px;font-size:14px}
.btn .ar{transition:transform .2s var(--ease)}
.btn:hover .ar{transform:translateX(3px)}
.badge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:500;white-space:nowrap;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.badge--primary{background:var(--primary-soft);color:var(--primary-text);border-color:transparent}
.badge--success{background:var(--success-soft);color:var(--success-text);border-color:transparent}
.badge--warning{background:var(--warning-soft);color:var(--warning-text);border-color:transparent}
.badge--error{background:var(--error-soft);color:var(--error-text);border-color:transparent}
.badge--info{background:var(--info-soft);color:var(--info-text);border-color:transparent}

/* ---------- Header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.hdr-in{display:flex;align-items:center;gap:32px;height:64px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;letter-spacing:-.04em;text-decoration:none}
.logo i{width:22px;height:22px;border-radius:50%;background:var(--text);position:relative;flex:none}
.logo i::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--primary)}
.logo small{font-size:14px;font-weight:500;color:var(--text-2);letter-spacing:-.01em}
.hdr-nav{display:flex;gap:28px;flex:1}
.hdr-nav a{font-size:14.5px;font-weight:500;color:var(--text-2);text-decoration:none;transition:color .15s}
.hdr-nav a:hover,.hdr-nav a[aria-current="true"]{color:var(--text)}
.hdr-end{display:flex;align-items:center;gap:8px;margin-left:auto}
.search-trigger{display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;min-width:220px;border:1px solid var(--border);border-radius:var(--r-8);background:var(--surface-2);color:var(--text-3);font-size:14px;cursor:pointer;transition:border-color .15s}
.search-trigger:hover{border-color:var(--border-2)}
.search-trigger svg{width:16px;height:16px}
.search-trigger kbd{margin-left:auto;font-family:var(--font);font-size:11.5px;color:var(--text-2);border:1px solid var(--border);border-radius:var(--r-4);padding:0 6px;background:var(--surface)}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--border);border-radius:var(--r-8);background:var(--surface);cursor:pointer}
.icon-btn svg{width:18px;height:18px}
.menu-btn{display:none}

/* ---------- HOME · Welcome ---------- */
.home{padding-block:32px 0}
.welcome{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-16);box-shadow:var(--sh-card);overflow:hidden;min-height:480px}
.w-copy{padding:40px 48px 48px;display:flex;flex-direction:column}
.w-top{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.w-top b{font-weight:700;font-size:18px;letter-spacing:-.04em}
.w-top span{color:var(--text-3)}
.w-main{margin-top:auto;padding-top:56px}
.w-main .dash{display:block;width:28px;height:3px;border-radius:2px;background:var(--primary);margin-bottom:24px}
.w-main .t-display{max-width:9em}
.w-sub{margin:20px 0 0;font-size:18px;line-height:1.65;color:var(--text-2)}
.w-sub b{color:var(--text);font-weight:600}
.w-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:32px}
.w-art{position:relative;background:var(--desk);overflow:hidden;min-height:320px}
.w-art .sun{position:absolute;right:-90px;top:-90px;width:320px;height:320px;border-radius:50%;background:var(--primary);opacity:.22}
.w-art .sheet{position:absolute;left:12%;bottom:-40px;width:58%;height:62%;background:var(--surface);border-radius:var(--r-8);box-shadow:var(--sh-card);transform:rotate(-6deg)}
.w-art .sheet i{display:block;height:7px;border-radius:4px;background:var(--surface-3);margin:22px 24px 0}
.w-art .sheet i:nth-child(2){width:60%;margin-top:12px}.w-art .sheet i:nth-child(3){width:75%;margin-top:12px}
.badge-card{position:absolute;right:16%;top:13%;width:min(210px,42%);transform:rotate(5deg);transform-origin:top center;animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(5deg)}50%{transform:rotate(3.5deg)}}
.badge-card .strap{position:absolute;left:50%;top:-140px;width:22px;height:150px;margin-left:-11px;background:var(--text);border-radius:3px}
.badge-card .clip{position:absolute;left:50%;top:-14px;width:36px;height:22px;margin-left:-18px;background:var(--border-2);border-radius:var(--r-4);z-index:1}
.badge-card .card{position:relative;background:var(--surface);border-radius:var(--r-12);box-shadow:var(--sh-pop);padding:22px 18px 18px;text-align:center}
.badge-card .hole{width:30px;height:5px;border-radius:3px;background:var(--surface-3);margin:0 auto 16px}
.badge-card .ph{width:64px;height:64px;border-radius:50%;margin:0 auto;background:var(--primary-soft);position:relative;overflow:hidden}
.badge-card .ph::before{content:"";position:absolute;left:50%;top:15px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:var(--primary)}
.badge-card .ph::after{content:"";position:absolute;left:50%;bottom:-14px;width:44px;height:34px;margin-left:-22px;border-radius:50%;background:var(--primary)}
.badge-card .nm{margin-top:12px;font-weight:600;font-size:15px}
.badge-card .rl{font-size:12px;color:var(--text-2)}
.badge-card .lg{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-weight:700;letter-spacing:-.04em;font-size:15px}
.w-art .hand{position:absolute;right:8%;bottom:12%;font-family:var(--hand);font-size:30px;line-height:1.05;color:var(--text);transform:rotate(-8deg);text-align:right}

/* ---------- HOME · sections ---------- */
.sec{padding-block:72px 0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:24px}
.sec-head p{margin:6px 0 0;color:var(--text-2);font-size:15px}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;counter-reset:s}
.step{position:relative;display:flex;flex-direction:column;gap:14px;padding:22px 20px 20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-12);text-decoration:none;transition:border-color .2s,box-shadow .2s,transform .2s var(--ease);min-width:0}
.step:hover{border-color:var(--border-2);box-shadow:var(--sh-card);transform:translateY(-2px)}
.step .no{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text-3)}
.step .no b{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--text);background:var(--surface-2)}
.step:first-child .no b{background:var(--primary);color:var(--on-primary)}
.step h3{margin:0;font-size:18px;font-weight:600;letter-spacing:-.02em;line-height:1.4}
.step ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px;color:var(--text-2);line-height:1.55}
.step li{position:relative;padding-left:12px}
.step li::before{content:"";position:absolute;left:0;top:.62em;width:4px;height:4px;border-radius:50%;background:var(--text-3)}
.step .go{margin-top:auto;padding-top:12px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:600}
.step .go span:last-child{color:var(--text-3);transition:transform .2s var(--ease),color .2s}
.step:hover .go span:last-child{transform:translateX(3px);color:var(--text)}

.doc-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.dg{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-12);padding:8px 8px 8px}
.dg h3{margin:0;padding:16px 16px 10px;font-size:14px;font-weight:600;color:var(--text-2)}
.dr{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border-radius:var(--r-8);text-decoration:none;transition:background-color .15s}
.dr:hover{background:var(--surface-2)}
.dr .ix{width:40px;height:40px;border-radius:var(--r-8);display:grid;place-items:center;background:var(--surface-2);font-size:13px;font-weight:600;color:var(--text-2);transition:background-color .15s}
.dr:hover .ix{background:var(--primary-soft);color:var(--primary-text)}
.dr b{display:block;font-size:16px;font-weight:600;letter-spacing:-.015em}
.dr small{display:block;font-size:13.5px;color:var(--text-2);margin-top:1px}
.dr .ar{color:var(--text-3)}

.vision{margin-top:72px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-16);padding:56px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:end;position:relative;overflow:hidden}
.vision::after{content:"";position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;border-radius:50%;background:var(--primary);opacity:.18}
.vision blockquote{margin:12px 0 0;font-size:clamp(22px,2.6vw,30px);line-height:1.5;letter-spacing:-.025em;font-weight:600;max-width:26em;text-wrap:balance}
.vision .btn{position:relative;z-index:1}

.help{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.help div{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-12);padding:20px 22px}
.help small{display:block;font-size:13.5px;color:var(--text-2)}
.help b{display:block;margin-top:4px;font-size:18px;font-weight:600;letter-spacing:-.02em}

.foot{margin-top:96px;border-top:1px solid var(--border);background:var(--surface)}
.foot-in{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:center;padding-block:28px calc(28px + env(safe-area-inset-bottom,0px));font-size:13.5px;color:var(--text-2)}

/* ---------- DETAIL ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);gap:40px;padding-block:32px 0;align-items:start}
.side{position:sticky;top:calc(88px + env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--border);border-radius:var(--r-12);padding:12px;max-height:calc(100vh - 112px);overflow-y:auto}
.side h4{margin:0;padding:12px 10px 6px;font-size:12.5px;font-weight:500;color:var(--text-3)}
.side h4:first-of-type{padding-top:6px}
.side a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-8);font-size:14.5px;color:var(--text-2);text-decoration:none;transition:background-color .15s,color .15s}
.side a:hover{background:var(--surface-2);color:var(--text)}
.side a[aria-current="page"]{background:var(--primary-soft);color:var(--text);font-weight:600}
.side a .dot{width:6px;height:6px;border-radius:50%;flex:none}
.side a .dot.w{background:var(--warning)}.side a .dot.e{background:var(--error)}
.side .home-l{margin-bottom:6px;color:var(--text);font-weight:500}

.doc-head{padding:8px 0 28px}
.crumb{font-size:14px;color:var(--text-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb a{text-decoration:none}
.crumb a:hover{color:var(--text)}
.doc-head .t-h1{margin-top:12px}
.doc-head .lede{margin:10px 0 0;font-size:17px;color:var(--text-2)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:20px}
.meta .m{font-size:13.5px;color:var(--text-2);margin-right:8px}
.meta a.badge{text-decoration:none}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin-top:20px}
.toc a{font-size:13.5px;text-decoration:none;padding:5px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--text-2);transition:border-color .15s,color .15s}
.toc a:hover{border-color:var(--border-2);color:var(--text)}

.paper{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-16);padding:44px 48px 48px;box-shadow:var(--sh-card);min-width:0}
.content{max-width:760px}
.content > h2{font-size:22px;font-weight:600;letter-spacing:-.025em;line-height:1.35;margin:56px 0 16px;scroll-margin-top:96px;display:flex;align-items:center;gap:12px}
.content > h2:first-child{margin-top:0}
.content > h2 .sn{width:28px;height:28px;border-radius:var(--r-8);display:grid;place-items:center;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--text-2);flex:none}
.content h3{font-size:17px;font-weight:600;margin:32px 0 10px}
.content p{margin:0 0 14px}
.content ul,.content ol{margin:0 0 16px;padding-left:22px}
.content li{margin:6px 0}
.content li::marker{color:var(--text-3)}
.content code{font-size:.88em;background:var(--surface-2);padding:2px 7px;border-radius:var(--r-4);border:1px solid var(--border)}
.content a.ext,.content a.int{color:var(--text);text-decoration:underline;text-decoration-color:var(--primary);text-decoration-thickness:2px;text-underline-offset:4px;font-weight:500}
.content a.ext:hover,.content a.int:hover{background:var(--primary-soft)}
.content a.ext::after{content:" ↗";font-size:.8em;color:var(--text-3)}
.flag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;color:var(--warning-text);background:var(--warning-soft);margin:0 2px;white-space:nowrap;vertical-align:1px;line-height:1}

.note{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:16px 18px;border-radius:var(--r-12);background:var(--surface-2);margin:20px 0;font-size:15px;color:var(--text)}
.note .ni{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface);color:var(--text-2);border:1px solid var(--border);margin-top:2px}
.note p{margin:0}.note p+p{margin-top:4px}
.note.warn{background:var(--warning-soft)}.note.warn .ni{color:var(--warning-text);border-color:transparent}
.note.danger{background:var(--error-soft)}.note.danger .ni{color:var(--error-text);border-color:transparent}
.note.info{background:var(--info-soft)}.note.info .ni{color:var(--info-text);border-color:transparent}

.tbl{overflow-x:auto;margin:14px 0 22px;border:1px solid var(--border);border-radius:var(--r-12)}
table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.6}
thead th{background:var(--surface-2);font-size:13px;font-weight:500;color:var(--text-2);text-align:left;padding:11px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
td,tbody th{padding:14px 16px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}
tbody tr{transition:background-color .15s}
tbody tr:hover{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
tbody th{font-weight:600;white-space:nowrap}
td{min-width:140px;color:var(--text)}

.spec{margin:14px 0 22px;border:1px solid var(--border);border-radius:var(--r-12);overflow:hidden}
.spec div{display:grid;grid-template-columns:150px minmax(0,1fr);border-bottom:1px solid var(--border)}
.spec div:last-child{border-bottom:0}
.spec dt{padding:14px 16px;background:var(--surface-2);font-weight:600;font-size:14.5px}
.spec dd{margin:0;padding:14px 18px}

.sched{list-style:none;margin:14px 0 22px;padding:0;position:relative}
.sched::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:2px;background:var(--border)}
.sched li{position:relative;display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:16px;padding:10px 0 10px 32px;margin:0}
.sched li::before{content:"";position:absolute;left:2px;top:17px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--border-2)}
.sched li:first-child::before{border-color:var(--primary);background:var(--primary)}
.sched .t{font-weight:600;font-variant-numeric:tabular-nums}
.sched .who .badge{height:22px;font-size:12px}

.years{list-style:none;margin:14px 0 22px;padding:0;display:grid;gap:8px}
.years li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:baseline;padding:16px 18px;background:var(--surface-2);border-radius:var(--r-12);margin:0}
.years .y{font-weight:700;font-size:18px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.years li:last-child{background:var(--primary-soft)}
blockquote.vision-q{margin:14px 0 24px;padding:28px 32px;border-radius:var(--r-12);background:var(--primary-soft);font-size:clamp(20px,2.4vw,26px);line-height:1.55;letter-spacing:-.025em;font-weight:600;text-wrap:balance}

.figure{margin:14px 0 22px;padding:28px;border-radius:var(--r-12);background:var(--surface-2);border:1px dashed var(--border-2);text-align:center;color:var(--text-2);font-size:15px}
.figure b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}

/* checklist (모바일 보드의 체크 패턴) */
.j-tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:4px 0 12px;font-size:13.5px;color:var(--text-2)}
.tgl{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer;font-size:14px;color:var(--text)}
.tgl .sw{width:36px;height:20px;border-radius:999px;background:var(--border-2);position:relative;transition:background-color .2s}
.tgl .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s var(--ease)}
.tgl[aria-pressed="true"] .sw{background:var(--primary)}
.tgl[aria-pressed="true"] .sw::after{transform:translateX(16px)}
.stops{margin:16px 0 0}
.jstop{border:1px solid var(--border);border-radius:var(--r-12);padding:6px 6px 6px;margin-bottom:12px;background:var(--surface)}
.jstop h4{margin:0;padding:12px 14px 8px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15.5px;font-weight:600}
.jstop h4 span{font-size:13px;color:var(--text-3);font-weight:500}
.ci{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-radius:var(--r-8);cursor:pointer;transition:background-color .15s}
.ci:hover{background:var(--surface-2)}
.ci input{position:absolute;opacity:0;pointer-events:none}
.ci .bx{width:22px;height:22px;flex:none;border-radius:50%;border:1.5px solid var(--border-2);display:grid;place-items:center;margin-top:1px;transition:background-color .2s,border-color .2s}
.ci .bx svg{width:12px;height:12px;stroke:var(--on-primary);stroke-width:2.4;fill:none;opacity:0;transform:scale(.5);transition:opacity .15s,transform .25s var(--ease)}
.ci input:checked+.bx{background:var(--primary);border-color:var(--primary)}
.ci input:checked+.bx svg{opacity:1;transform:none}
.ci input:focus-visible+.bx{outline:2px solid var(--primary-text);outline-offset:2px}
.ci .tx{font-size:15px;transition:color .2s}

/* ---------- state (체크 표시는 각자 브라우저에만 남음) ---------- */
const KEY = "narka-onboarding-v1";
let state = {checks:{}, onlyOpen:false};
try{ const s = JSON.parse(localStorage.getItem(KEY) || "null"); if(s && s.checks) state = Object.assign(state, s); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

const byId = Object.fromEntries(PAGES.map(p => [p.id, p]));
const chapNo = id => String(PAGES.findIndex(p => p.id === id) + 1).padStart(2, "0");
const checkLists = {};
PAGES.forEach(p => p.blocks.forEach(b => { if(b.t === "check") checkLists[b.id] = {page:p.id, items:b.items}; }));
const ALL_LISTS = Object.keys(checkLists);
const listTotal = ids => ids.reduce((n, id) => n + (checkLists[id] ? checkLists[id].items.length : 0), 0);
const pageLists = pid => ALL_LISTS.filter(id => checkLists[id].page === pid);
const flagCount = p => JSON.stringify(p.blocks).split("{!").length - 1;
function statusBadge(p){
  const lists = pageLists(p.id);
  if(lists.length) return `<span class="badge">체크리스트 ${listTotal(lists)}개</span>`;
  if(p.review) return `<span class="badge badge--error">노무 검토 후 게시</span>`;
  const f = flagCount(p); return f ? `<span class="badge badge--warning">확인 필요 ${f}건</span>` : `<span class="badge badge--success">확정 내용</span>`;
}

/* ---------- formatting ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmt(s){
  let h = esc(s);
  h = h.replace(/\{!([^}]*)\}/g, (_, t) => `<span class="flag">${t || "확인 필요"}</span>`);
  h = h.replace(/\[([^\]]+)\]\((#[\w-]+)\)/g, (_, t, u) => `<a class="int" href="${u}" data-nav="${u.slice(1)}">${t}</a>`);
  h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (_, t, u) => `<a class="ext" href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`);
  h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
  return h.replace(/\n/g, "<br>");
}
const plain = s => String(s).replace(/\{!([^}]*)\}/g, "$1").replace(/\[([^\]]+)\]\([^)]+\)/g, "$1").replace(/\*\*|`/g, "");

/* ---------- blocks ---------- */
const CHECK_SVG = '<svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg>';
const items = arr => arr.map(it => typeof it === "string" ? `<li>${fmt(it)}</li>` : `<li>${fmt(it.text)}<ul>${it.sub.map(s => `<li>${fmt(s)}</li>`).join("")}</ul></li>`).join("");
const NOTE_ICON = {warn:"!", danger:"!", info:"i", soft:"i"};
let secN = 0;
function renderBlock(b, p, ctx){
  switch(b.t){
    case "h2": secN++; return `<h2 id="sec-${b.id}"><span class="sn">${String(secN).padStart(2, "0")}</span>${esc(b.text)}</h2>`;
    case "h3": return `<h3>${esc(b.text)}</h3>`;
    case "ul": return `<ul>${items(b.items)}</ul>`;
    case "ol": return `<ol>${items(b.items)}</ol>`;
    case "quote": return `<blockquote class="vision-q">${fmt(b.text)}</blockquote>`;
    case "callout": { const tone = b.tone === "soft" ? "" : b.tone; return `<div class="note ${tone}"><span class="ni" aria-hidden="true">${NOTE_ICON[b.tone] || "i"}</span><div>${b.text.split("\n").map(l => `<p>${fmt(l)}</p>`).join("")}</div></div>`; }
    case "kv": return `<dl class="spec">${b.rows.map(r => `<div><dt>${esc(r[0])}</dt><dd>${fmt(r[1])}</dd></div>`).join("")}</dl>`;
    case "table":
      if(p.id === "benefits" && b.head.length === 3 && b.head[0] === "구분") return benefitSpread(b);
      return `<div class="tbl"><table><thead><tr>${b.head.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r => `<tr>${r.map((c, i) => i === 0 ? `<th scope="row">${fmt(c)}</th>` : `<td>${fmt(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    case "timeline":
      if(p.id === "about") return `<ol class="years">${b.rows.map(r => `<li><span class="y">${esc(r[0])}</span><span>${fmt(r[1])}</span></li>`).join("")}</ol>`;
      return `<ol class="sched">${b.rows.map(r => `<li><span class="t">${esc(r[0])}</span><span>${fmt(r[1])}</span><span class="who">${r[2] ? `<span class="badge">${esc(r[2])}</span>` : ""}</span></li>`).join("")}</ol>`;
    case "figure": return `<div class="figure"><b>${esc(b.title)}</b>${esc(b.text)}<br><a class="btn btn--sm" style="margin-top:14px" href="${NOTION(b.link)}" target="_blank" rel="noopener noreferrer">노션 원본에서 보기 ↗</a></div>`;
    case "tools":
      if(ctx.toolsDone) return ""; ctx.toolsDone = true;
      return `<div class="j-tools"><button class="tgl" data-act="only-open" aria-pressed="${state.onlyOpen}"><span class="sw"></span>체크하지 않은 항목만 보기</button><span>스스로 확인하는 용도이며, 체크 표시는 이 브라우저에만 남습니다.</span></div>`;
    case "check":
      return `<div class="stops ${state.onlyOpen ? "only-open" : ""}"><div class="jstop" data-list="${b.id}"><h4>${esc(b.title)}<span>${b.items.length}개</span></h4>
        ${b.items.map((it, i) => { const k = b.id + ":" + i, on = !!state.checks[k];
          return `<label class="ci ${on ? "done" : ""}" for="c-${k}"><input type="checkbox" id="c-${k}" data-key="${k}" ${on ? "checked" : ""}><span class="bx">${CHECK_SVG}</span><span class="tx">${fmt(it)}</span></label>`; }).join("")}</div></div>`;
  }
  return "";
}
const BENE_TONE = {"성장":"badge--info","휴가":"badge--success","근속":"badge--primary","생활":"","보상":"badge--warning"};
function benefitSpread(b){
  const cats = [];
  b.rows.forEach(r => { let c = cats.find(x => x.name === r[0]); if(!c){ c = {name:r[0], rows:[]}; cats.push(c); } c.rows.push(r); });
  return `<div class="bene">${cats.map(c => `<section class="bene-cat ${c.rows.length > 4 || c.name === "보상" ? "wide" : ""}"><h3><span class="badge ${BENE_TONE[c.name] || ""}">${esc(c.name)}</span><span class="t-cap">${c.rows.length}가지</span></h3>${c.rows.map(r => `<div class="bene-item"><b>${fmt(r[1])}</b><span>${fmt(r[2])}</span></div>`).join("")}</section>`).join("")}</div>`;
}

/* ---------- router ---------- */
let current = "home";
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function go(id, anchor){
  if(!byId[id] && id !== "home") id = "home";
  current = id;
  closeOv("menu");
  root.innerHTML = id === "home" ? homeView() : docView(byId[id]);
  document.title = id === "home" ? "NARKA Onboarding" : byId[id].title + " · NARKA Onboarding";
  document.querySelectorAll("#hdrNav a").forEach(a => a.toggleAttribute("aria-current", id !== "home" && byId[id].group === a.dataset.g));
  document.querySelectorAll("#hdrNav a[aria-current]").forEach(a => a.setAttribute("aria-current", "true"));
  try{ history.replaceState(null, "", "#" + id); }catch(e){}
  if(anchor){ const el = document.getElementById("sec-" + anchor) || document.getElementById(anchor); if(el){ requestAnimationFrame(() => el.scrollIntoView({block:"start"})); return; } }
  scrollTo({top:0, behavior:"instant"});
}

document.addEventListener("click", e => {
  if(e.target.closest("[data-open-search]")){ openOv("search"); return; }
  const sc = e.target.closest("[data-scroll]");
  if(sc){ e.preventDefault(); const t = document.getElementById(sc.dataset.scroll); if(t) t.scrollIntoView({behavior:reduce ? "auto" : "smooth"}); return; }
  const a = e.target.closest("[data-nav]");
  if(a && !a.closest("#searchOv")){ e.preventDefault(); go(a.dataset.nav, a.dataset.anchor); return; }
  const cl = e.target.closest("[data-close]");
  if(cl){ closeOv(cl.dataset.close); return; }
  const act = e.target.closest("[data-act]");
  if(!act) return;
  if(act.dataset.act === "only-open"){
    state.onlyOpen = !state.onlyOpen; save();
    act.setAttribute("aria-pressed", state.onlyOpen);
    document.querySelectorAll(".stops").forEach(s => s.classList.toggle("only-open", state.onlyOpen));
  }
  if(act.dataset.act === "reset"){
    if(act.dataset.confirm !== "1"){ act.dataset.confirm = "1"; act.textContent = "한 번 더 누르면 지워집니다"; return; }
    pageLists(act.dataset.page).forEach(id => checkLists[id].items.forEach((_, i) => delete state.checks[id + ":" + i]));
    save(); go(current);
  }
});
document.addEventListener("change", e => {
  const cb = e.target.closest("input[data-key]"); if(!cb) return;
  if(cb.checked) state.checks[cb.dataset.key] = true; else delete state.checks[cb.dataset.key];
  save();
  cb.closest(".ci").classList.toggle("done", cb.checked);
});

/* ---------- overlays ---------- */
const menuOv = document.getElementById("menuOv"), searchOv = document.getElementById("searchOv");
let lastFocus = null;
function openOv(which){
  lastFocus = document.activeElement;
  if(which === "menu"){ document.getElementById("menuBody").innerHTML = `<nav class="side" aria-label="온보딩 문서">${sideNav(current)}</nav>`; menuOv.hidden = false; menuOv.querySelector("[data-close]").focus(); }
  else { searchOv.hidden = false; q.value = ""; runSearch(); setTimeout(() => q.focus(), 10); }
  document.body.style.overflow = "hidden";
}
function closeOv(which){
  const ov = which === "menu" ? menuOv : searchOv;
  if(ov.hidden) return;
  ov.hidden = true; document.body.style.overflow = "";
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
document.getElementById("menuBtn").addEventListener("click", () => openOv("menu"));
document.getElementById("searchBtn").addEventListener("click", () => openOv("search"));

/* ---------- search ---------- */
const q = document.getElementById("q"), results = document.getElementById("results"), filters = document.getElementById("filters");
let filter = "all", activeIdx = 0;
function blockText(b){
  if(b.text) return plain(b.text);
  if(b.items) return b.items.map(i => typeof i === "string" ? plain(i) : plain(i.text) + " " + i.sub.map(plain).join(" ")).join(" ");
  if(b.rows) return b.rows.map(r => r.map(plain).join(" ")).join(" ");
  return "";
}
const INDEX = [];
PAGES.forEach(p => { let sec = null; p.blocks.forEach(b => { if(b.t === "h2") sec = b; INDEX.push({page:p, sec, text:(b.t === "h2" ? b.text : blockText(b)) + (b.title ? " " + b.title : "")}); }); INDEX.push({page:p, sec:null, text:p.title + " " + p.desc}); });
filters.innerHTML = [{id:"all", name:"전체"}].concat(GROUPS).map(g => `<button data-f="${g.id}" aria-pressed="${g.id === "all"}">${g.name}</button>`).join("");
filters.addEventListener("click", e => { const b = e.target.closest("[data-f]"); if(!b) return; filter = b.dataset.f; filters.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); runSearch(); });
function snippet(t, term){
  const i = t.toLowerCase().indexOf(term.toLowerCase()); if(i < 0) return esc(t.slice(0, 90));
  const s = Math.max(0, i - 30), part = t.slice(s, i + term.length + 60);
  return (s > 0 ? "…" : "") + esc(part).replace(new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => `<mark>${m}</mark>`) + "…";
}
function runSearch(){
  const term = q.value.trim(); let hits;
  if(!term) hits = PAGES.filter(p => filter === "all" || p.group === filter).map(p => ({page:p, sec:null, html:esc(p.desc)}));
  else { const seen = new Set(); hits = [];
    INDEX.forEach(r => { if(filter !== "all" && r.page.group !== filter) return; if(!r.text.toLowerCase().includes(term.toLowerCase())) return;
      const key = r.page.id + (r.sec ? r.sec.id : ""); if(seen.has(key)) return; seen.add(key); hits.push({page:r.page, sec:r.sec, html:snippet(r.text, term)}); }); }
  activeIdx = 0;
  results.innerHTML = hits.length ? hits.slice(0, 30).map((h, i) => `<a class="s-r ${i === 0 ? "on" : ""}" href="#${h.page.id}" data-go="${h.page.id}" data-sec="${h.sec ? h.sec.id : ""}"><small>${GROUPS.find(g => g.id === h.page.group).name}${h.sec ? " · " + esc(h.sec.text) : ""}</small><b>${esc(h.page.title)}</b><p>${h.html}</p></a>`).join("")
    : `<div class="s-empty">'${esc(term)}'에 맞는 내용이 없습니다. 다른 단어로 찾아보세요.</div>`;
}
searchOv.addEventListener("click", e => { const r = e.target.closest("[data-go]"); if(r){ e.preventDefault(); closeOv("search"); go(r.dataset.go, r.dataset.sec || null); } });
q.addEventListener("input", runSearch);
q.addEventListener("keydown", e => {
  const its = [...results.querySelectorAll(".s-r")];
  if(e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); if(!its.length) return; its[activeIdx].classList.remove("on"); activeIdx = (activeIdx + (e.key === "ArrowDown" ? 1 : -1) + its.length) % its.length; its[activeIdx].classList.add("on"); its[activeIdx].scrollIntoView({block:"nearest"}); }
  if(e.key === "Enter" && its[activeIdx]){ e.preventDefault(); its[activeIdx].click(); }
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape"){ closeOv("search"); closeOv("menu"); }
  if((e.key === "/" || (e.key.toLowerCase() === "k" && (e.metaKey || e.ctrlKey))) && searchOv.hidden && !/input|textarea/i.test(document.activeElement.tagName)){ e.preventDefault(); openOv("search"); }
});

/* ---------- boot ---------- */
const start = (location.hash || "").slice(1);
go(byId[start] ? start : "home");
</script>

</body></html>
