<!doctype html><html><head><meta name="robots" content="noindex, nofollow"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>NARKA Onboarding</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 한국어 명조 제목 + 넉넉한 본문의 브랜드북. 유일한 그래픽은 '겹겹이 쌓이는 색의 층'(브랜드 시그너처 패턴의 해석) — 단계가 진행될수록 층이 하나씩 늘어난다.
   영문은 첫 인사(둥글고 두꺼운 서체)에만 쓴다. 색상은 공개 인터뷰의 '따뜻한 옐로' 해석값 — 공식 가이드 수령 시 --l*, --sun만 교체 */
:root{
  --paper:#FFFDF7;
  --paper-2:#F6F0E2;
  --ink:#221E17;
  --ink-2:#4F483C;
  --muted:#7D7466;
  --rule:#E8E0CE;
  --rule-2:#D3C7AF;
  --sun:#F2C230;
  --sun-soft:#FCEFC4;
  --on-sun:#221E17;
  --l1:#FBEFC6;
  --l2:#F7DB80;
  --l3:#F2C230;
  --l4:#D9971F;
  --l5:#8A5A2B;
  --flag:#94570A;
  --flag-bg:#FCEFD0;
  --alert:#A93C26;
  --alert-bg:#FAE5DE;
  --ok:#3B7451;
  --scrim:rgba(34,30,23,.4);
  --round:"Nunito","Noto Sans KR",system-ui,sans-serif;
  --serif:"Gowun Batang","Noto Serif KR","AppleMyungjo",serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --hdr:var(--paper);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#16130F;--paper-2:#1F1B15;--ink:#F2EBDC;--ink-2:#D2C9B8;--muted:#9B9181;--rule:#2F2920;--rule-2:#433B2E;--sun:#F2C230;--sun-soft:#3A3014;--on-sun:#221E17;--l1:#3A3014;--l2:#6B5418;--l3:#B38D1E;--l4:#D9971F;--l5:#B07A45;--flag:#E8B25A;--flag-bg:#2E2412;--alert:#EE8C73;--alert-bg:#331B15;--ok:#7CC49A;--scrim:rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16130F;--paper-2:#1F1B15;--ink:#F2EBDC;--ink-2:#D2C9B8;--muted:#9B9181;--rule:#2F2920;--rule-2:#433B2E;--sun:#F2C230;--sun-soft:#3A3014;--on-sun:#221E17;--l1:#3A3014;--l2:#6B5418;--l3:#B38D1E;--l4:#D9971F;--l5:#B07A45;--flag:#E8B25A;--flag-bg:#2E2412;--alert:#EE8C73;--alert-bg:#331B15;--ok:#7CC49A;--scrim:rgba(0,0,0,.55);color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere;letter-spacing:-.01em}
body.at-hero{--hdr:var(--sun)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--hdr)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.g{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
.serif{font-family:var(--serif)}

/* ---------- 층 (strata) ---------- */
.strata{display:flex;flex-direction:column}
.strata i{display:block;width:100%}
.strata .a{background:var(--l1)}.strata .b{background:var(--l2)}.strata .c{background:var(--l3)}.strata .d{background:var(--l4)}.strata .e{background:var(--l5)}

/* ---------- header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--hdr);border-bottom:1px solid transparent;transition:background .25s,border-color .25s}
body:not(.at-hero) .hdr{border-bottom-color:var(--rule)}
.hdr-in{display:flex;align-items:center;gap:28px;height:64px}
.mark{font-family:var(--round);font-weight:900;font-size:24px;letter-spacing:-.04em;text-decoration:none;line-height:1}
.hdr-sp{flex:1}
.hdr nav{display:flex;gap:24px}
.hdr nav a,.hbtn{font-size:14px;text-decoration:none;color:var(--ink);background:none;border:0;padding:6px 0;cursor:pointer;border-bottom:1px solid transparent}
.hdr nav a:hover,.hbtn:hover{border-bottom-color:currentColor}
.hbtn{font-weight:700}

/* ---------- HOME · 첫 인사 ---------- */
.hero{background:var(--sun);color:var(--on-sun)}
.hero-in{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:0 24px;padding-block:40px 64px}
.kicker{grid-column:1/-1;font-size:13.5px;margin:0 0 56px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hero h1{grid-column:1/10;margin:0;font-family:var(--round);font-weight:900;font-size:clamp(64px,11.6vw,168px);line-height:.86;letter-spacing:-.045em}
.hero h1 span{display:block}
.hero h1 .to{padding-left:1.15em}
.hero-note{grid-column:9/13;align-self:end;margin-top:32px}
.hero-note .kor{font-family:var(--serif);font-weight:700;font-size:clamp(21px,2vw,26px);line-height:1.55;margin:0 0 24px}
.hero-cta{display:inline-flex;gap:10px;align-items:center;font-size:15px;font-weight:700;text-decoration:none;border-bottom:2px solid var(--on-sun);padding-bottom:4px}
.hero-cta:hover span{transform:translateY(2px)}
.hero-cta span{display:inline-block;transition:transform .2s}
.hero-strata i:nth-child(1){height:6px}.hero-strata i:nth-child(2){height:12px}.hero-strata i:nth-child(3){height:22px}

/* ---------- HOME · 편지 ---------- */
.letter{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;padding-block:88px 72px}
.side{grid-column:1/4;font-size:13.5px;color:var(--muted);padding-top:10px}
.letter-body{grid-column:4/11}
.letter-body p{font-family:var(--serif);font-size:clamp(21px,2.1vw,27px);line-height:1.75;margin:0 0 18px;text-wrap:pretty}
.letter-body .sign{font-family:var(--body);font-size:14.5px;color:var(--ink-2);margin-top:28px}
.lines{grid-column:4/13;margin-top:40px;padding-top:24px;border-top:1px solid var(--rule)}
.lines small{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
.lines a{font-family:var(--serif);font-weight:700;font-size:clamp(20px,2.2vw,28px);text-decoration:none;line-height:1.7;background:linear-gradient(var(--sun),var(--sun)) 0 100%/0 3px no-repeat;transition:background-size .3s}
.lines a:hover{background-size:100% 3px}
.lines .sl{color:var(--rule-2);margin:0 .4em;font-family:var(--body);font-weight:400}

/* ---------- HOME · 순서 ---------- */
.sec-title{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;margin-bottom:36px;align-items:end}
.sec-title h2{grid-column:1/9;font-family:var(--serif);font-weight:700;font-size:clamp(30px,3.6vw,46px);line-height:1.3;margin:0;letter-spacing:-.02em}
.sec-title p{grid-column:9/13;margin:0;font-size:14.5px;color:var(--ink-2)}
.journey{padding-block:40px 96px}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--ink)}
.step{display:flex;flex-direction:column;text-decoration:none;padding:0 20px 28px 0;border-right:1px solid var(--rule);min-width:0}
.step + .step{padding-left:20px}
.step:last-child{border-right:0}
.step .stack{height:40px;display:flex;flex-direction:column;justify-content:flex-end;margin:0 -20px 0 0}
.step + .step .stack{margin-left:-20px}
.step .stack i{height:8px}
.step .when{font-size:13px;color:var(--muted);margin-top:22px}
.step h3{font-family:var(--serif);font-weight:700;font-size:23px;line-height:1.35;margin:4px 0 14px;letter-spacing:-.02em}
.step ul{list-style:none;padding:0;margin:0 0 20px;font-size:14px;line-height:1.65;color:var(--ink-2);display:grid;gap:6px}
.step .pend{font-size:13px;color:var(--flag)}
.step .more{margin-top:auto;font-size:13.5px;font-weight:700}
.step:hover h3{text-decoration:underline;text-decoration-color:var(--sun);text-decoration-thickness:3px;text-underline-offset:6px}

/* ---------- HOME · 문서 목록 ---------- */
.docs{background:var(--paper-2);padding-block:88px 72px}
.dgroup{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;border-top:1px solid var(--ink);padding-top:18px;margin-bottom:44px}
.dgroup h3{grid-column:1/4;margin:0;font-size:14px;font-weight:700}
.dlist{grid-column:4/13;display:grid}
.drow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:20px;align-items:baseline;padding:0 0 18px;margin-bottom:18px;border-bottom:1px solid var(--rule);text-decoration:none}
.dlist .drow:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.drow .n{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.drow b{font-family:var(--serif);font-weight:700;font-size:clamp(21px,2.3vw,28px);line-height:1.3;letter-spacing:-.02em}
.drow small{display:block;font-size:14px;color:var(--ink-2);margin-top:4px}
.drow .st{font-size:12.5px;color:var(--muted);white-space:nowrap}
.drow .flag-t{color:var(--flag)}.drow .alert-t{color:var(--alert)}
.drow:hover b{text-decoration:underline;text-decoration-color:var(--sun);text-decoration-thickness:3px;text-underline-offset:6px}

/* ---------- HOME · 비전 / 문의 ---------- */
.vision{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;padding-block:96px 80px}
.vision .vstack{grid-column:1/3;align-self:stretch;display:flex;flex-direction:row}
.vision .vstack i{width:auto;flex:1}
.vision blockquote{grid-column:4/12;margin:0;font-family:var(--serif);font-weight:700;font-size:clamp(26px,3.3vw,44px);line-height:1.5;letter-spacing:-.02em;text-wrap:balance}
.vision .src{grid-column:4/12;font-size:14px;color:var(--muted);margin:-4px 0 0}
.vision .src a{color:var(--ink);font-weight:500}
.help{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;padding-block:40px 88px}
.help h2{grid-column:1/4;margin:0;font-family:var(--serif);font-size:22px;font-weight:700}
.help dl{grid-column:4/13;margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;border-top:1px solid var(--ink);padding-top:18px}
.help dt{font-size:14px;color:var(--muted)}
.help dd{margin:4px 0 0;font-family:var(--serif);font-weight:700;font-size:24px}

.foot{background:var(--ink);color:var(--paper)}
.foot .strata i{height:6px}
.foot-in{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:baseline;padding-block:36px calc(36px + env(safe-area-inset-bottom,0px));font-size:13px}
.foot .mark{font-size:28px;color:var(--paper)}
.foot p{margin:0;opacity:.72;max-width:36em}

/* ---------- DETAIL ---------- */
.chap{background:var(--paper-2)}
.chap-in{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;padding-block:48px 44px}
.chap-side{grid-column:1/4;font-size:13.5px;color:var(--muted);display:grid;align-content:start;gap:2px}
.chap-side b{font-weight:500;color:var(--ink)}
.chap-main{grid-column:4/13}
.crumb{font-size:13.5px;color:var(--muted);margin-bottom:12px}
.crumb a{text-decoration:none;border-bottom:1px solid var(--rule-2)}
.chap h1{font-family:var(--serif);font-weight:700;font-size:clamp(34px,4.6vw,58px);line-height:1.2;letter-spacing:-.03em;margin:0;text-wrap:balance}
.chap .lede{margin:12px 0 0;font-size:16.5px;color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:22px;font-size:13px;color:var(--muted)}
.meta a{color:var(--muted)}
.meta .flag-t{color:var(--flag);font-weight:500}.meta .alert-t{color:var(--alert);font-weight:500}.meta .ok-t{color:var(--ok);font-weight:500}
.chap .strata i:nth-child(1){height:3px}.chap .strata i:nth-child(2){height:6px}

.layout{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;padding-block:52px 96px}
.rail{grid-column:1/4;position:sticky;top:calc(88px + env(safe-area-inset-top,0px));align-self:start;font-size:14px;padding-right:12px}
.rail h4{margin:0 0 8px;font-size:12.5px;color:var(--muted);font-weight:500}
.rail ol{list-style:none;margin:0;padding:0}
.rail a{display:flex;gap:10px;padding:5px 0;text-decoration:none;color:var(--ink-2);line-height:1.5}
.rail a span{font-size:12px;color:var(--muted);width:20px;flex:none;padding-top:2px;font-variant-numeric:tabular-nums}
.rail a:hover{color:var(--ink)}
.rail a[aria-current="page"]{color:var(--ink);font-weight:700;box-shadow:inset 0 -3px 0 var(--sun);width:max-content;max-width:100%}
.rail .home-l{display:inline-block;margin-bottom:28px;font-weight:500;color:var(--ink);border-bottom:1px solid var(--rule-2);padding:0}
.rail .toc{margin-top:28px;padding-top:18px;border-top:1px solid var(--rule)}

.content{grid-column:4/12;min-width:0}
.content > h2{font-family:var(--serif);font-weight:700;font-size:clamp(23px,2.3vw,29px);letter-spacing:-.02em;line-height:1.35;margin:64px 0 18px;scroll-margin-top:96px;display:flex;gap:14px;align-items:baseline}
.content > h2:first-child{margin-top:0}
.content > h2 .sn{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted);flex:none}
.content h3{font-size:17px;font-weight:700;margin:36px 0 10px}
.content p{margin:0 0 14px}
.content ul,.content ol{margin:0 0 18px;padding-left:22px}
.content li{margin:6px 0}
.content li::marker{color:var(--muted)}
.content code{font-size:.88em;background:var(--paper-2);padding:1px 6px;border:1px solid var(--rule)}
.content a.ext,.content a.int{text-decoration:none;font-weight:500;box-shadow:inset 0 -2px 0 var(--sun)}
.content a.ext:hover,.content a.int:hover{box-shadow:inset 0 -.6em 0 var(--sun-soft)}
.content a.ext::after{content:" ↗";font-size:.8em;color:var(--muted)}

.flag{display:inline-block;font-size:12.5px;font-weight:500;color:var(--flag);background:var(--flag-bg);padding:0 7px;margin:0 2px;white-space:nowrap;line-height:1.7}

.note-b{padding:2px 0 2px 18px;margin:22px 0;border-left:2px solid var(--rule-2);color:var(--ink-2);font-size:15px}
.note-b p{margin:0}.note-b p+p{margin-top:4px}
.note-b.warn{border-left-color:var(--sun);background:var(--sun-soft);padding:14px 18px;color:var(--ink)}
.note-b.danger{border-left-color:var(--alert);background:var(--alert-bg);padding:14px 18px;color:var(--ink)}
.note-b.info{border-left-color:var(--l4)}

.tbl{overflow-x:auto;margin:16px 0 26px}
table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.7}
thead th{font-size:12.5px;font-weight:500;color:var(--muted);text-align:left;padding:0 16px 10px 0;border-bottom:1px solid var(--ink);white-space:nowrap}
td,tbody th{padding:15px 16px 15px 0;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
tbody th{font-weight:700;white-space:nowrap;padding-right:28px}
td{min-width:140px}

.spec{margin:16px 0 26px;border-top:1px solid var(--ink)}
.spec div{display:grid;grid-template-columns:minmax(110px,160px) minmax(0,1fr);gap:20px;padding:15px 0;border-bottom:1px solid var(--rule)}
.spec dt{font-weight:700;font-size:14.5px}
.spec dd{margin:0}

.sched{list-style:none;padding:0;margin:16px 0 26px;border-top:1px solid var(--ink)}
.sched li{display:grid;grid-template-columns:116px minmax(0,1fr) auto;gap:20px;padding:15px 0;border-bottom:1px solid var(--rule);margin:0}
.sched .t{font-weight:700;font-variant-numeric:tabular-nums}
.sched .who{font-size:13px;color:var(--muted);white-space:nowrap}

.years{list-style:none;padding:0;margin:20px 0 28px}
.years li{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr);gap:24px;padding:20px 0;border-top:1px solid var(--rule);margin:0;align-items:baseline}
.years .y{font-family:var(--serif);font-weight:700;font-size:clamp(24px,2.8vw,34px);letter-spacing:-.02em;line-height:1.1}
.years li:last-child .y{box-shadow:inset 0 -6px 0 var(--sun);width:max-content}
.years .w{font-size:16.5px}

blockquote.vision-q{margin:20px 0 32px;font-family:var(--serif);font-weight:700;font-size:clamp(25px,3vw,38px);line-height:1.55;letter-spacing:-.02em;text-wrap:balance}

.figure{margin:16px 0 28px;padding:28px;background:var(--paper-2);font-size:15px;color:var(--ink-2)}
.figure b{display:block;font-family:var(--serif);font-size:20px;color:var(--ink);margin-bottom:4px}

/* 체크리스트 */
.j-tools{display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--muted);margin:4px 0 8px}
.tgl{background:none;border:0;padding:0;cursor:pointer;font-size:13.5px;display:inline-flex;gap:8px;align-items:center;color:var(--ink)}
.tgl .sw{width:30px;height:18px;border-radius:9px;background:var(--rule-2);position:relative;transition:background .2s}
.tgl .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--paper);transition:transform .2s}
.tgl[aria-pressed="true"] .sw{background:var(--ink)}
.tgl[aria-pressed="true"] .sw::after{transform:translateX(12px)}
.stops{margin:28px 0 8px}
.jstop{display:grid;grid-template-columns:72px minmax(0,1fr);gap:0 20px;padding-top:18px;border-top:1px solid var(--ink)}
.jstop .layer{display:flex;flex-direction:column;justify-content:flex-end;height:40px}
.jstop .layer i{height:8px}
.jstop h4{margin:0;font-size:17px;font-weight:700;display:flex;justify-content:space-between;gap:12px;align-items:baseline;line-height:1.5}
.jstop h4 span{font-size:13px;color:var(--muted);font-weight:400}
.jbody{min-width:0;padding-bottom:20px}
.ci{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.ci:first-of-type{margin-top:8px}
.ci:last-child{border-bottom:0}
.ci input{position:absolute;opacity:0;pointer-events:none}
.ci .bx{width:20px;height:20px;flex:none;border:1.5px solid var(--ink-2);display:grid;place-items:center;margin-top:3px;transition:background .2s,border-color .2s}
.ci .bx svg{width:12px;height:12px;stroke:var(--on-sun);stroke-width:2.6;fill:none;opacity:0;transition:opacity .2s}
.ci input:checked+.bx{background:var(--sun);border-color:var(--sun)}
.ci input:checked+.bx svg{opacity:1}
.ci input:focus-visible+.bx{outline:2px solid var(--ink);outline-offset:3px}
.ci.done .tx{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--rule-2)}
.only-open .ci.done{display:none}
.reset{background:none;border:0;padding:0;cursor:pointer;color:var(--muted);font-size:13.5px;border-bottom:1px solid var(--rule-2)}

/* 복리후생 지면 */
.bene{margin:12px 0 40px}
.bene-cat{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:24px;padding:24px 0;border-top:1px solid var(--ink)}
.bene-cat h3{margin:0;font-family:var(--serif);font-weight:700;font-size:clamp(26px,3vw,36px);line-height:1.1}
.bene-cat h3 small{display:block;font-family:var(--body);font-size:13px;font-weight:400;color:var(--muted);margin-top:8px}
.bene-item{padding:0 0 14px;margin-bottom:14px;border-bottom:1px solid var(--rule)}
.bene-item:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}

/* ---------- state (체크 표시는 각자 브라우저에만 남음) ---------- */
const KEY = "narka-onboarding-v1";
let state = {checks:{}, onlyOpen:false};
try{ const s = JSON.parse(localStorage.getItem(KEY) || "null"); if(s && s.checks) state = Object.assign(state, s); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

const byId = Object.fromEntries(PAGES.map(p => [p.id, p]));
const chapNo = id => String(PAGES.findIndex(p => p.id === id) + 1).padStart(2, "0");
const checkLists = {};
PAGES.forEach(p => p.blocks.forEach(b => { if(b.t === "check") checkLists[b.id] = {page:p.id, items:b.items, title:b.title}; }));
const ALL_LISTS = Object.keys(checkLists);
function listTotal(ids){ return ids.reduce((n, id) => n + (checkLists[id] ? checkLists[id].items.length : 0), 0); }
const pageLists = pid => ALL_LISTS.filter(id => checkLists[id].page === pid);
const flagCount = p => JSON.stringify(p.blocks).split("{!").length - 1;
const LAYERS = ["a","b","c","d","e"];
const stack = n => LAYERS.slice(0, n).map(c => `<i class="${c}"></i>`).reverse().join("");
function statusText(p){
  const lists = pageLists(p.id);
  if(lists.length) return `<span>체크리스트 ${listTotal(lists)}개</span>`;
  if(p.review) return `<span class="alert-t">노무 검토 후 게시</span>`;
  const f = flagCount(p); return f ? `<span class="flag-t">확인 필요 ${f}건</span>` : `<span>확정 내용</span>`;
}

/* ---------- inline formatting ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmt(s){
  let h = esc(s);
  h = h.replace(/\{!([^}]*)\}/g, (_, t) => `<span class="flag">${t || "확인 필요"}</span>`);
  h = h.replace(/\[([^\]]+)\]\((#[\w-]+)\)/g, (_, t, u) => `<a class="int" href="${u}" data-nav="${u.slice(1)}">${t}</a>`);
  h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (_, t, u) => `<a class="ext" href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`);
  h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
  return h.replace(/\n/g, "<br>");
}
const plain = s => String(s).replace(/\{!([^}]*)\}/g, "$1").replace(/\[([^\]]+)\]\([^)]+\)/g, "$1").replace(/\*\*|`/g, "");

/* ---------- blocks ---------- */
const CHECK_SVG = '<svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg>';
const items = arr => arr.map(it => typeof it === "string" ? `<li>${fmt(it)}</li>` : `<li>${fmt(it.text)}<ul>${it.sub.map(s => `<li>${fmt(s)}</li>`).join("")}</ul></li>`).join("");
let secN = 0, stopN = 0;

function renderBlock(b, p, ctx){
  switch(b.t){
    case "h2": secN++; return `<h2 id="sec-${b.id}"><span class="sn">${String(secN).padStart(2, "0")}</span>${esc(b.text)}</h2>`;
    case "h3": return `<h3>${esc(b.text)}</h3>`;
    case "ul": return `<ul>${items(b.items)}</ul>`;
    case "ol": return `<ol>${items(b.items)}</ol>`;
    case "quote": return `<blockquote class="vision-q">${fmt(b.text)}</blockquote>`;
    case "callout": return `<div class="note-b ${b.tone === "soft" ? "" : b.tone}">${b.text.split("\n").map(l => `<p>${fmt(l)}</p>`).join("")}</div>`;
    case "kv": return `<dl class="spec">${b.rows.map(r => `<div><dt>${esc(r[0])}</dt><dd>${fmt(r[1])}</dd></div>`).join("")}</dl>`;
    case "table":
      if(p.id === "benefits" && b.head.length === 3 && b.head[0] === "구분") return benefitSpread(b);
      return `<div class="tbl"><table><thead><tr>${b.head.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r => `<tr>${r.map((c, i) => i === 0 ? `<th scope="row">${fmt(c)}</th>` : `<td>${fmt(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    case "timeline":
      if(p.id === "about") return `<ol class="years">${b.rows.map(r => `<li><span class="y">${esc(r[0])}</span><span class="w">${fmt(r[1])}</span></li>`).join("")}</ol>`;
      return `<ol class="sched">${b.rows.map(r => `<li><span class="t">${esc(r[0])}</span><span>${fmt(r[1])}</span><span class="who">${esc(r[2] || "")}</span></li>`).join("")}</ol>`;
    case "figure": return `<div class="figure"><b>${esc(b.title)}</b>${esc(b.text)}<br><a class="ext" href="${NOTION(b.link)}" target="_blank" rel="noopener noreferrer" style="text-decoration:none;box-shadow:inset 0 -2px 0 var(--sun);display:inline-block;margin-top:10px;font-weight:500">노션 원본에서 보기</a></div>`;
    case "tools":
      if(ctx.toolsDone) return ""; ctx.toolsDone = true;
      return `<div class="j-tools"><button class="tgl" data-act="only-open" aria-pressed="${state.onlyOpen}"><span class="sw"></span>체크하지 않은 항목만 보기</button><span>스스로 확인하는 용도이며, 체크 표시는 이 브라우저에만 남습니다.</span></div>`;
    case "check": return journeyStop(b);
  }
  return "";
}
function journeyStop(b){
  stopN++;
  const n = b.items.length;
  return `<div class="stops ${state.onlyOpen ? "only-open" : ""}"><div class="jstop" data-list="${b.id}">
    <div class="layer strata" aria-hidden="true">${stack(Math.min(stopN, 5))}</div>
    <div class="jbody"><h4>${esc(b.title)}<span>${n}개</span></h4>
    ${b.items.map((it, i) => { const k = b.id + ":" + i, on = !!state.checks[k];
      return `<label class="ci ${on ? "done" : ""}" for="c-${k}"><input type="checkbox" id="c-${k}" data-key="${k}" ${on ? "checked" : ""}><span class="bx">${CHECK_SVG}</span><span class="tx">${fmt(it)}</span></label>`; }).join("")}
  </div></div></div>`;
}
function benefitSpread(b){
  const cats = [];
  b.rows.forEach(r => { let c = cats.find(x => x.name === r[0]); if(!c){ c = {name:r[0], rows:[]}; cats.push(c); } c.rows.push(r); });
  return `<div class="bene">${cats.map(c => `<section class="bene-cat"><h3>${esc(c.name)}<small>${c.rows.length}가지</small></h3><div>${c.rows.map(r => `<div class="bene-item"><b>${fmt(r[1])}</b><span>${fmt(r[2])}</span></div>`).join("")}</div></section>`).join("")}</div>`;
}

function onScroll(){
  const hero = document.querySelector(".hero");
  document.body.classList.toggle("at-hero", !!hero && hero.getBoundingClientRect().bottom > 64);
}
addEventListener("scroll", onScroll, {passive:true});
addEventListener("resize", onScroll);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- router ---------- */
let current = "home";
function go(id, anchor){
  if(!byId[id] && id !== "home") id = "home";
  current = id;
  closeOv("menu");
  root.innerHTML = id === "home" ? homeView() : docView(byId[id]);
  document.title = id === "home" ? "NARKA Onboarding" : byId[id].title + " · NARKA Onboarding";
  try{ history.replaceState(null, "", "#" + id); }catch(e){}
  onScroll();
  if(anchor){ const el = document.getElementById("sec-" + anchor) || document.getElementById(anchor); if(el){ requestAnimationFrame(() => { el.scrollIntoView({block:"start"}); onScroll(); }); return; } }
  scrollTo({top:0, behavior:"instant"});
}

document.addEventListener("click", e => {
  const sc = e.target.closest("[data-scroll]");
  if(sc){ e.preventDefault(); const t = document.getElementById(sc.dataset.scroll); if(t) t.scrollIntoView({behavior:reduce ? "auto" : "smooth"}); return; }
  const a = e.target.closest("[data-nav]");
  if(a && !a.closest("#searchOv")){ e.preventDefault(); go(a.dataset.nav, a.dataset.anchor); return; }
  const cl = e.target.closest("[data-close]");
  if(cl){ closeOv(cl.dataset.close); return; }
  const act = e.target.closest("[data-act]");
  if(!act) return;
  if(act.dataset.act === "only-open"){
    state.onlyOpen = !state.onlyOpen; save();
    act.setAttribute("aria-pressed", state.onlyOpen);
    document.querySelectorAll(".stops").forEach(s => s.classList.toggle("only-open", state.onlyOpen));
  }
  if(act.dataset.act === "reset"){
    if(act.dataset.confirm !== "1"){ act.dataset.confirm = "1"; act.textContent = "한 번 더 누르면 지워집니다"; return; }
    pageLists(act.dataset.page).forEach(id => checkLists[id].items.forEach((_, i) => delete state.checks[id + ":" + i]));
    save(); go(current);
  }
});

document.addEventListener("change", e => {
  const cb = e.target.closest("input[data-key]"); if(!cb) return;
  if(cb.checked) state.checks[cb.dataset.key] = true; else delete state.checks[cb.dataset.key];
  save();
  cb.closest(".ci").classList.toggle("done", cb.checked);
});

/* ---------- overlays ---------- */
const menuOv = document.getElementById("menuOv"), searchOv = document.getElementById("searchOv");
let lastFocus = null;
function openOv(which){
  lastFocus = document.activeElement;
  if(which === "menu"){ renderMenu(); menuOv.hidden = false; menuOv.querySelector(".close-x").focus(); }
  else { searchOv.hidden = false; q.value = ""; runSearch(); setTimeout(() => q.focus(), 10); }
  document.body.style.overflow = "hidden";
}
function closeOv(which){
  const ov = which === "menu" ? menuOv : searchOv;
  if(ov.hidden) return;
  ov.hidden = true; document.body.style.overflow = "";
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
document.getElementById("menuBtn").addEventListener("click", () => openOv("menu"));
document.getElementById("searchBtn").addEventListener("click", () => openOv("search"));

/* ---------- search ---------- */
const q = document.getElementById("q"), results = document.getElementById("results"), filters = document.getElementById("filters");
let filter = "all", activeIdx = 0;
function blockText(b){
  if(b.text) return plain(b.text);
  if(b.items) return b.items.map(i => typeof i === "string" ? plain(i) : plain(i.text) + " " + i.sub.map(plain).join(" ")).join(" ");
  if(b.rows) return b.rows.map(r => r.map(plain).join(" ")).join(" ");
  return "";
}
const INDEX = [];
PAGES.forEach(p => { let sec = null; p.blocks.forEach(b => { if(b.t === "h2") sec = b; INDEX.push({page:p, sec, text:(b.t === "h2" ? b.text : blockText(b)) + (b.title ? " " + b.title : "")}); }); INDEX.push({page:p, sec:null, text:p.title + " " + p.desc}); });
filters.innerHTML = [{id:"all", name:"전체"}].concat(GROUPS).map(g => `<button data-f="${g.id}" aria-pressed="${g.id === "all"}">${g.name}</button>`).join("");
filters.addEventListener("click", e => { const b = e.target.closest("[data-f]"); if(!b) return; filter = b.dataset.f; filters.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); runSearch(); });
function snippet(t, term){
  const i = t.toLowerCase().indexOf(term.toLowerCase()); if(i < 0) return esc(t.slice(0, 90));
  const s = Math.max(0, i - 30), part = t.slice(s, i + term.length + 60);
  return (s > 0 ? "…" : "") + esc(part).replace(new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => `<mark>${m}</mark>`) + "…";
}
function runSearch(){
  const term = q.value.trim(); let hits;
  if(!term) hits = PAGES.filter(p => filter === "all" || p.group === filter).map(p => ({page:p, sec:null, html:esc(p.desc)}));
  else { const seen = new Set(); hits = [];
    INDEX.forEach(r => { if(filter !== "all" && r.page.group !== filter) return; if(!r.text.toLowerCase().includes(term.toLowerCase())) return;
      const key = r.page.id + (r.sec ? r.sec.id : ""); if(seen.has(key)) return; seen.add(key); hits.push({page:r.page, sec:r.sec, html:snippet(r.text, term)}); }); }
  activeIdx = 0;
  results.innerHTML = hits.length ? hits.slice(0, 30).map((h, i) => `<a class="s-r ${i === 0 ? "on" : ""}" href="#${h.page.id}" data-go="${h.page.id}" data-sec="${h.sec ? h.sec.id : ""}"><small>${chapNo(h.page.id)} · ${GROUPS.find(g => g.id === h.page.group).name}${h.sec ? " · " + esc(h.sec.text) : ""}</small><b>${esc(h.page.title)}</b><p>${h.html}</p></a>`).join("")
    : `<div class="s-empty">'${esc(term)}'에 맞는 내용이 없습니다. 다른 단어로 찾아보세요.</div>`;
}
searchOv.addEventListener("click", e => { const r = e.target.closest("[data-go]"); if(r){ e.preventDefault(); closeOv("search"); go(r.dataset.go, r.dataset.sec || null); } });
q.addEventListener("input", runSearch);
q.addEventListener("keydown", e => {
  const its = [...results.querySelectorAll(".s-r")];
  if(e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); if(!its.length) return; its[activeIdx].classList.remove("on"); activeIdx = (activeIdx + (e.key === "ArrowDown" ? 1 : -1) + its.length) % its.length; its[activeIdx].classList.add("on"); its[activeIdx].scrollIntoView({block:"nearest"}); }
  if(e.key === "Enter" && its[activeIdx]){ e.preventDefault(); its[activeIdx].click(); }
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape"){ closeOv("search"); closeOv("menu"); }
  if((e.key === "/" || (e.key.toLowerCase() === "k" && (e.metaKey || e.ctrlKey))) && searchOv.hidden && !/input|textarea/i.test(document.activeElement.tagName)){ e.preventDefault(); openOv("search"); }
});

/* ---------- boot ---------- */
const start = (location.hash || "").slice(1);
go(byId[start] ? start : "home");
</script>

</body></html>
